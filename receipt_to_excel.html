<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3초 AI 영수증 엑셀 변환기 - StarSign Toolkit</title>
    <meta name="description" content="영수증 사진을 올리면 AI가 핵심 5개 항목만 쏙 뽑아 엑셀(.xlsx)로 즉시 다운로드합니다.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-700 transition mr-2 text-sm font-semibold">
                    <i class="fa-solid fa-arrow-left mr-1"></i> 허브로
                </a>
                <span class="text-xl">🧾</span>
                <h1 class="text-lg font-bold text-slate-900">3초 AI 영수증 엑셀 변환기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-50 text-indigo-600 border border-indigo-200">
                Cloudflare Vision AI 초고속 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left: Upload & Image Viewer (5 cols) -->
        <div class="lg:col-span-5 flex flex-col space-y-4">
            
            <!-- Upload Box -->
            <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-indigo-400 bg-white rounded-2xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center min-h-[160px]">
                <input type="file" id="image-input" accept="image/*" class="hidden">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">영수증 사진 업로드 / 드래그</p>
                <p class="text-xs text-slate-400 mt-1">클립보드 이미지 붙여넣기(Ctrl+V) 지원</p>
            </div>

            <!-- Image Preview Box -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 flex-1 flex flex-col items-center justify-center min-h-[300px] overflow-hidden relative">
                <div id="img-placeholder" class="text-slate-300 text-sm flex flex-col items-center">
                    <i class="fa-regular fa-image text-4xl mb-2"></i>
                    영수증 이미지를 올리면 원본 대조창이 표시됩니다.
                </div>
                <img id="receipt-preview" class="hidden max-h-[420px] w-auto rounded-lg object-contain border border-slate-100 shadow-sm">
                
                <!-- Loading Overlay -->
                <div id="loading-overlay" class="hidden absolute inset-0 bg-white/85 backdrop-blur-xs flex flex-col items-center justify-center space-y-3">
                    <div class="w-8 h-8 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p id="status-text" class="text-xs font-semibold text-indigo-600">AI가 영수증 항목을 분석 중입니다 (약 1~2초)...</p>
                </div>
            </div>
        </div>

        <!-- Right: Dual Confirmation Editor & Excel Export (7 cols) -->
        <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                    <div>
                        <h2 class="text-base font-bold text-slate-900">추출 데이터 확인 및 수정</h2>
                        <p class="text-xs text-slate-500">인식된 값을 확인하고 표 안에서 바로 수정할 수 있습니다.</p>
                    </div>
                    <button id="add-row-btn" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-200 hover:bg-indigo-50 transition">
                        + 수동 행 추가
                    </button>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                <th class="py-2.5 px-3 font-bold rounded-l-lg">결제일자</th>
                                <th class="py-2.5 px-3 font-bold">상호명(가맹점)</th>
                                <th class="py-2.5 px-3 font-bold">품목/적요</th>
                                <th class="py-2.5 px-3 font-bold text-right">결제금액</th>
                                <th class="py-2.5 px-3 font-bold">결제수단</th>
                                <th class="py-2.5 px-2 text-center rounded-r-lg">삭제</th>
                            </tr>
                        </thead>
                        <tbody id="receipt-table-body" class="divide-y divide-slate-100">
                            <tr id="empty-row">
                                <td colspan="6" class="py-12 text-center text-slate-400">
                                    영수증을 올리면 5개 핵심 항목이 즉시 채워집니다.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="pt-6 border-t border-slate-100 mt-6 flex items-center justify-between">
                <div class="text-xs text-slate-500">
                    총 <span id="item-count" class="font-bold text-slate-800">0</span>건 / 합계: <span id="total-amount" class="font-bold text-indigo-600 text-sm">0</span>원
                </div>
                <div class="flex space-x-2">
                    <button id="clear-btn" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50 transition">
                        초기화
                    </button>
                    <button id="export-excel-btn" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-excel text-sm"></i>
                        <span>엑셀(.xlsx) 다운로드</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const WORKER_ENDPOINT = "https://receipt-ai-ocr.jmoonx.workers.dev";

        const dropZone = document.getElementById('drop-zone');
        const imageInput = document.getElementById('image-input');
        const receiptPreview = document.getElementById('receipt-preview');
        const imgPlaceholder = document.getElementById('img-placeholder');
        const loadingOverlay = document.getElementById('loading-overlay');
        const tableBody = document.getElementById('receipt-table-body');
        const exportExcelBtn = document.getElementById('export-excel-btn');
        const clearBtn = document.getElementById('clear-btn');
        const addRowBtn = document.getElementById('add-row-btn');
        const itemCountEl = document.getElementById('item-count');
        const totalAmountEl = document.getElementById('total-amount');

        let parsedDataList = [];

        dropZone.addEventListener('click', () => imageInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-indigo-50/20'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/20'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/20');
            if (e.dataTransfer.files.length) handleImageFile(e.dataTransfer.files[0]);
        });
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleImageFile(e.target.files[0]);
        });
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    handleImageFile(items[i].getAsFile());
                    break;
                }
            }
        });

        async function handleImageFile(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result;
                receiptPreview.src = base64Data;
                receiptPreview.classList.remove('hidden');
                imgPlaceholder.classList.add('hidden');
                loadingOverlay.classList.remove('hidden');

                try {
                    const response = await fetch(WORKER_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageBase64: base64Data })
                    });

                    const result = await response.json();
                    if (result.success && result.data) {
                        addRow(result.data);
                    } else {
                        throw new Error(result.error || '항목 추출에 실패했습니다.');
                    }
                } catch (err) {
                    alert('AI 분석 오류: ' + err.message);
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        function addRow(data) {
            const emptyRow = document.getElementById('empty-row');
            if (emptyRow) emptyRow.remove();

            parsedDataList.push({
                date: data.date || new Date().toISOString().split('T')[0],
                store: data.store || '미확인 상호',
                item: data.item || '일반 지출',
                amount: Number(data.amount) || 0,
                method: data.method || '신용카드'
            });
            renderTable();
        }

        function renderTable() {
            tableBody.innerHTML = '';
            let total = 0;

            parsedDataList.forEach((row, index) => {
                total += Number(row.amount) || 0;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition";
                tr.innerHTML = `
                    <td class="py-2.5 px-3"><input type="text" value="${row.date}" onchange="updateData(${index}, 'date', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-indigo-500 outline-none"></td>
                    <td class="py-2.5 px-3"><input type="text" value="${row.store}" onchange="updateData(${index}, 'store', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-indigo-500 outline-none font-semibold text-slate-900"></td>
                    <td class="py-2.5 px-3"><input type="text" value="${row.item}" onchange="updateData(${index}, 'item', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-indigo-500 outline-none"></td>
                    <td class="py-2.5 px-3 text-right"><input type="number" value="${row.amount}" onchange="updateData(${index}, 'amount', this.value)" class="w-full text-right bg-transparent border-b border-transparent focus:border-indigo-500 outline-none font-semibold text-indigo-600"></td>
                    <td class="py-2.5 px-3">
                        <select onchange="updateData(${index}, 'method', this.value)" class="bg-transparent border-b border-transparent focus:border-indigo-500 outline-none text-slate-700">
                            <option value="신용카드" ${row.method === '신용카드' ? 'selected' : ''}>신용카드</option>
                            <option value="현금" ${row.method === '현금' ? 'selected' : ''}>현금</option>
                            <option value="간편결제" ${row.method === '간편결제' ? 'selected' : ''}>간편결제</option>
                            <option value="계좌이체" ${row.method === '계좌이체' ? 'selected' : ''}>계좌이체</option>
                        </select>
                    </td>
                    <td class="py-2.5 px-2 text-center">
                        <button onclick="deleteRow(${index})" class="text-slate-300 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            itemCountEl.innerText = parsedDataList.length;
            totalAmountEl.innerText = total.toLocaleString();
        }

        window.updateData = (index, key, value) => {
            parsedDataList[index][key] = (key === 'amount') ? Number(value) : value;
            renderTable();
        };

        window.deleteRow = (index) => {
            parsedDataList.splice(index, 1);
            if (parsedDataList.length === 0) {
                tableBody.innerHTML = `<tr id="empty-row"><td colspan="6" class="py-12 text-center text-slate-400">영수증을 올리면 5개 핵심 항목이 즉시 채워집니다.</td></tr>`;
                itemCountEl.innerText = 0;
                totalAmountEl.innerText = 0;
            } else {
                renderTable();
            }
        };

        addRowBtn.addEventListener('click', () => {
            addRow({
                date: new Date().toISOString().split('T')[0],
                store: "신규 가맹점",
                item: "지출 항목",
                amount: 0,
                method: "신용카드"
            });
        });

        clearBtn.addEventListener('click', () => {
            parsedDataList = [];
            tableBody.innerHTML = `<tr id="empty-row"><td colspan="6" class="py-12 text-center text-slate-400">영수증을 올리면 5개 핵심 항목이 즉시 채워집니다.</td></tr>`;
            receiptPreview.src = '';
            receiptPreview.classList.add('hidden');
            imgPlaceholder.classList.remove('hidden');
            itemCountEl.innerText = 0;
            totalAmountEl.innerText = 0;
        });

        exportExcelBtn.addEventListener('click', () => {
            if (parsedDataList.length === 0) {
                alert('엑셀로 내보낼 데이터가 없습니다.');
                return;
            }

            const exportData = parsedDataList.map((d, i) => ({
                "No": i + 1,
                "결제일자": d.date,
                "가맹점(상호명)": d.store,
                "품목/적요": d.item,
                "결제금액(원)": Number(d.amount),
                "결제수단": d.method
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "영수증지출내역");

            worksheet['!cols'] = [
                { wch: 6 },
                { wch: 14 },
                { wch: 22 },
                { wch: 20 },
                { wch: 14 },
                { wch: 12 }
            ];

            const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
            XLSX.writeFile(workbook, `영수증_지출내역_${today}.xlsx`);
        });
    </script>
</body>
</html>
