<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 Toolkit Hub</a>
      <div class="flex items-center gap-3">
        <a href="/ko/markdown-previewer" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">Korean</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full flex flex-col">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Text & Content</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Markdown Live Editor</h1>
      <p class="text-xs text-slate-400">Real-time split preview and raw HTML generator. 100% private in your browser.</p>
    </div>

    <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-2.5 rounded-t-xl text-xs">
      <span class="text-slate-400 font-mono">Split-Screen Workspace</span>
      <div class="flex gap-2">
        <button onclick="copyHtml()" id="copyHtmlBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">Copy Raw HTML</button>
        <button onclick="copyMarkdown()" id="copyMdBtn" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">Copy Markdown</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border border-slate-800 rounded-b-xl overflow-hidden min-h-[480px] flex-1">
      <textarea id="mdInput" placeholder="Type Markdown here..." class="w-full h-80 md:h-full p-4 bg-slate-950 text-slate-200 focus:outline-none font-mono text-sm leading-relaxed resize-none border-b md:border-b-0 md:border-r border-slate-800"></textarea>
      <div id="previewArea" class="w-full h-80 md:h-full p-4 bg-slate-950/60 overflow-y-auto prose-custom text-sm"></div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Part of the StarSign16 Ecosystem. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">Main Hub</a></p>
  </footer>

  <script>
    const mdInput = document.getElementById('mdInput');
    const previewArea = document.getElementById('previewArea');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const copyMdBtn = document.getElementById('copyMdBtn');

    const sample = `# StarSign16 Toolkit
A fast, **serverless** micro-utility suite.

## Features
* 100% Client-Side
* Zero Server Costs
* Instant Rendering

> Privacy-first development workflow.

\`\`\`javascript
const fast = true;
console.log("Welcome Jay!");
\`\`\`
`;

    function renderMarkdown() {
      previewArea.innerHTML = marked.parse(mdInput.value);
    }

    function copyHtml() {
      const html = marked.parse(mdInput.value);
      navigator.clipboard.writeText(html);
      copyHtmlBtn.innerText = 'Copied HTML!';
      setTimeout(() => copyHtmlBtn.innerText = 'Copy Raw HTML', 1500);
    }

    function copyMarkdown() {
      navigator.clipboard.writeText(mdInput.value);
      copyMdBtn.innerText = 'Copied Markdown!';
      setTimeout(() => copyMdBtn.innerText = 'Copy Markdown', 1500);
    }

    mdInput.addEventListener('input', renderMarkdown);
    mdInput.value = sample;
    renderMarkdown();
  </script>
</body>
