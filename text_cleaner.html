<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고속 텍스트 리스트 중복 제거 & 정렬기 - StarSign Toolkit</title>
    <meta name="description" content="수천 줄의 키워드, 이메일, 텍스트 데이터의 중복을 0.1초 만에 제거하고 원하는 형식으로 정렬 및 추출합니다.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-700 transition mr-2 text-sm font-semibold">
                    <i class="fa-solid fa-arrow-left mr-1"></i> 허브로
                </a>
                <span class="text-xl">🧹</span>
                <h1 class="text-lg font-bold text-slate-900">텍스트 중복 제거 & 정렬기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-50 text-emerald-600 border border-emerald-200">
                100% 클라이언트 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Options Bar -->
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 text-xs">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-trim" checked class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-slate-700 font-medium">앞뒤 공백 제거</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-case" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-slate-700 font-medium">대소문자 구분 없음</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-empty" checked class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-slate-700 font-medium">빈 줄 자동 제거</span>
                </label>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-500 font-medium">구분자:</span>
                    <select id="opt-delimiter" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none text-slate-700">
                        <option value="newline">줄바꿈(엔터)</option>
                        <option value="comma">쉼표(,)</option>
                        <option value="space">공백(스페이스)</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-500 font-medium">정렬:</span>
                    <select id="opt-sort" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none text-slate-700">
                        <option value="none">원래 순서 유지</option>
                        <option value="asc">오름차순 (가나다/ABC)</option>
                        <option value="desc">내림차순 (하파타/ZYX)</option>
                        <option value="length">글자 길이순</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-500 font-medium">출력 구분:</span>
                    <select id="opt-output-delimiter" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none text-slate-700">
                        <option value="newline">줄바꿈</option>
                        <option value="comma">쉼표+공백 (, )</option>
                        <option value="comma-only">쉼표만 (,)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Textarea Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Input Box -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between shadow-sm">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                        <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">원본 텍스트 입력</span>
                        <button id="clear-input-btn" class="text-xs text-slate-400 hover:text-slate-600 transition">비우기</button>
                    </div>
                    <textarea id="input-text" class="w-full h-80 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs text-slate-800 focus:bg-white focus:border-indigo-500 outline-none resize-none transition" placeholder="중복을 제거할 텍스트 리스트를 여기에 붙여넣으세요...&#10;예:&#10;apple&#10;banana&#10;apple&#10;orange&#10;banana"></textarea>
                </div>
                <div class="pt-3 border-t border-slate-100 mt-3 text-xs text-slate-500 flex justify-between">
                    <span>입력 항목: <strong id="input-count" class="text-slate-800 font-semibold">0</strong>개</span>
                    <span>글자 수: <strong id="input-chars" class="text-slate-800 font-semibold">0</strong>자</span>
                </div>
            </div>

            <!-- Output Box -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between shadow-sm">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">정리된 결과</span>
                            <span id="dedup-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200">중복 0개 제거됨</span>
                        </div>
                        <button id="copy-btn" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 transition">
                            <i class="fa-regular fa-clone"></i>
                            <span id="copy-text">결과 복사</span>
                        </button>
                    </div>
                    <textarea id="output-text" readonly class="w-full h-80 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs text-slate-800 outline-none resize-none" placeholder="실시간으로 정리된 결과가 여기에 표시됩니다."></textarea>
                </div>
                <div class="pt-3 border-t border-slate-100 mt-3 text-xs text-slate-500 flex justify-between">
                    <span>최종 항목: <strong id="output-count" class="text-indigo-600 font-bold">0</strong>개</span>
                    <span>글자 수: <strong id="output-chars" class="text-slate-800 font-semibold">0</strong>자</span>
                </div>
            </div>

        </div>

    </main>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const optTrim = document.getElementById('opt-trim');
        const optCase = document.getElementById('opt-case');
        const optEmpty = document.getElementById('opt-empty');
        const optDelimiter = document.getElementById('opt-delimiter');
        const optSort = document.getElementById('opt-sort');
        const optOutputDelimiter = document.getElementById('opt-output-delimiter');
        const inputCount = document.getElementById('input-count');
        const inputChars = document.getElementById('input-chars');
        const outputCount = document.getElementById('output-count');
        const outputChars = document.getElementById('output-chars');
        const dedupBadge = document.getElementById('dedup-badge');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const clearInputBtn = document.getElementById('clear-input-btn');

        function processText() {
            const raw = inputText.value;
            inputChars.innerText = raw.length.toLocaleString();

            if (!raw) {
                outputText.value = '';
                inputCount.innerText = '0';
                outputCount.innerText = '0';
                outputChars.innerText = '0';
                dedupBadge.innerText = '중복 0개 제거됨';
                return;
            }

            // 1. 구분자 기준 분리
            let items = [];
            if (optDelimiter.value === 'newline') {
                items = raw.split(/\r?\n/);
            } else if (optDelimiter.value === 'comma') {
                items = raw.split(',');
            } else if (optDelimiter.value === 'space') {
                items = raw.split(/\s+/);
            }

            inputCount.innerText = items.length.toLocaleString();

            // 2. 공백 및 빈 줄 처리
            if (optTrim.checked) {
                items = items.map(s => s.trim());
            }
            if (optEmpty.checked) {
                items = items.filter(s => s.length > 0);
            }

            // 3. 중복 제거
            const seen = new Set();
            const unique = [];

            for (const item of items) {
                const checkKey = optCase.checked ? item.toLowerCase() : item;
                if (!seen.has(checkKey)) {
                    seen.add(checkKey);
                    unique.push(item);
                }
            }

            const removedCount = items.length - unique.length;
            dedupBadge.innerText = `중복 ${removedCount.toLocaleString()}개 제거됨`;

            // 4. 정렬
            if (optSort.value === 'asc') {
                unique.sort((a, b) => a.localeCompare(b, 'ko'));
            } else if (optSort.value === 'desc') {
                unique.sort((a, b) => b.localeCompare(a, 'ko'));
            } else if (optSort.value === 'length') {
                unique.sort((a, b) => a.length - b.length || a.localeCompare(b, 'ko'));
            }

            // 5. 출력 구분자 조합
            let outSep = '\n';
            if (optOutputDelimiter.value === 'comma') outSep = ', ';
            else if (optOutputDelimiter.value === 'comma-only') outSep = ',';

            const resultStr = unique.join(outSep);
            outputText.value = resultStr;
            outputCount.innerText = unique.length.toLocaleString();
            outputChars.innerText = resultStr.length.toLocaleString();
        }

        // Event Listeners
        [inputText, optTrim, optCase, optEmpty, optDelimiter, optSort, optOutputDelimiter].forEach(el => {
            el.addEventListener('input', processText);
            el.addEventListener('change', processText);
        });

        clearInputBtn.addEventListener('click', () => {
            inputText.value = '';
            processText();
            inputText.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!outputText.value) return;
            await navigator.clipboard.writeText(outputText.value);
            copyText.innerText = '복사 완료!';
            setTimeout(() => { copyText.innerText = '결과 복사'; }, 1500);
        });
    </script>
</body>
</html>
