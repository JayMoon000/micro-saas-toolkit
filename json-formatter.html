<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SEO & Open Graph -->
  <title>StarSign16 Toolkit - Free Web Utilities</title>
  <meta name="description" content="Fast, 100% client-side privacy-first web utilities with no logins.">

  <meta property="og:title" content="StarSign16 Toolkit - Free Web Utilities">
  <meta property="og:description" content="Fast, 100% client-side privacy-first web utilities with no logins.">
  <meta property="og:url" content="https://tool.starsign16.com/json-formatter">
  <!-- Analytics: GA4 & Cloudflare -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6LFL2P1WRN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6LFL2P1WRN');
  </script>
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6d000ebb184d437c8af3ee42a914a19d"}'></script>
  <!-- End Analytics -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 Toolkit Hub</a>
      <div class="flex items-center gap-3">
        <a href="/ko/json-formatter" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">Korean</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full flex flex-col">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Dev & Data</span>
      </div>
      <h1 class="text-2xl font-bold text-white">JSON Formatter & Validator</h1>
      <p class="text-xs text-slate-400">Beautify, minify, and check JSON syntax with precise error detection locally.</p>
    </div>

    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-t-xl flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="formatJSON(2)" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">✨ Beautify (2 Spaces)</button>
        <button onclick="formatJSON(4)" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">✨ Beautify (4 Spaces)</button>
        <button onclick="minifyJSON()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">🗜️ Minify (1 Line)</button>
        <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded transition">Load Sample</button>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearAll()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium transition">Clear</button>
        <button onclick="copyOutput()" id="copyBtn" class="px-3.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-medium transition">Copy Result</button>
      </div>
    </div>

    <div id="statusBanner" class="hidden px-4 py-2 text-xs font-mono border-x border-slate-800 transition-all"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border border-slate-800 rounded-b-xl overflow-hidden min-h-[460px] flex-1">
      <div class="flex flex-col bg-slate-950 border-b md:border-b-0 md:border-r border-slate-800">
        <div class="px-3 py-1.5 bg-slate-900/60 border-b border-slate-800 text-[11px] font-mono text-slate-400 flex justify-between">
          <span>RAW JSON INPUT</span>
          <span id="inputStats" class="text-slate-500">0 chars</span>
        </div>
        <textarea id="rawInput" placeholder="Paste unformatted or raw JSON here..." class="flex-1 w-full p-4 bg-transparent text-sm text-slate-200 focus:outline-none font-mono leading-relaxed resize-none h-72 md:h-full"></textarea>
      </div>

      <div class="flex flex-col bg-slate-950/60">
        <div class="px-3 py-1.5 bg-slate-900/60 border-b border-slate-800 text-[11px] font-mono text-slate-400 flex justify-between">
          <span>FORMATTED / VALIDATED OUTPUT</span>
          <span id="outputStats" class="text-slate-500">0 chars</span>
        </div>
        <textarea id="formattedOutput" readonly placeholder="Formatted JSON will appear here..." class="flex-1 w-full p-4 bg-transparent text-sm text-cyan-300 focus:outline-none font-mono leading-relaxed resize-none h-72 md:h-full"></textarea>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Part of the StarSign16 Ecosystem. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">Main Hub</a></p>
  </footer>

  <script>
    const rawInput = document.getElementById('rawInput');
    const formattedOutput = document.getElementById('formattedOutput');
    const statusBanner = document.getElementById('statusBanner');
    const inputStats = document.getElementById('inputStats');
    const outputStats = document.getElementById('outputStats');
    const copyBtn = document.getElementById('copyBtn');

    function setStatus(msg, isError = false) {
      statusBanner.classList.remove('hidden', 'bg-emerald-950/60', 'text-emerald-400', 'border-emerald-800/80', 'bg-rose-950/60', 'text-rose-400', 'border-rose-800/80');
      if (isError) {
        statusBanner.classList.add('bg-rose-950/60', 'text-rose-400', 'border-rose-800/80');
        statusBanner.innerHTML = `⚠️ <strong>Invalid JSON:</strong> ${msg}`;
      } else {
        statusBanner.classList.add('bg-emerald-950/60', 'text-emerald-400', 'border-emerald-800/80');
        statusBanner.innerHTML = `✓ <strong>Valid JSON:</strong> ${msg}`;
      }
    }

    function formatJSON(indent = 2) {
      const val = rawInput.value.trim();
      if (!val) {
        formattedOutput.value = '';
        statusBanner.classList.add('hidden');
        updateStats();
        return;
      }

      try {
        const parsed = JSON.parse(val);
        const res = JSON.stringify(parsed, null, indent);
        formattedOutput.value = res;
        setStatus(`Successfully parsed & formatted with ${indent}-space indentation.`, false);
      } catch (err) {
        formattedOutput.value = '';
        setStatus(err.message, true);
      }
      updateStats();
    }

    function minifyJSON() {
      const val = rawInput.value.trim();
      if (!val) return;

      try {
        const parsed = JSON.parse(val);
        const res = JSON.stringify(parsed);
        formattedOutput.value = res;
        setStatus('Successfully minified into a single line.', false);
      } catch (err) {
        formattedOutput.value = '';
        setStatus(err.message, true);
      }
      updateStats();
    }

    function loadSample() {
      const sample = {
        name: "StarSign16 Toolkit",
        version: "1.0.0",
        clientSide: true,
        features: ["JSON Formatter", "Base64 Tool", "Regex Tester", "URL Parser"],
        serverCost: "$0"
      };
      rawInput.value = JSON.stringify(sample);
      formatJSON(2);
    }

    function clearAll() {
      rawInput.value = '';
      formattedOutput.value = '';
      statusBanner.classList.add('hidden');
      updateStats();
      rawInput.focus();
    }

    function copyOutput() {
      if (!formattedOutput.value) return;
      navigator.clipboard.writeText(formattedOutput.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => copyBtn.innerText = 'Copy Result', 1500);
    }

    function updateStats() {
      inputStats.innerText = `${rawInput.value.length} chars`;
      outputStats.innerText = `${formattedOutput.value.length} chars`;
    }

    rawInput.addEventListener('input', () => {
      updateStats();
      if (rawInput.value.trim()) {
        formatJSON(2);
      } else {
        formattedOutput.value = '';
        statusBanner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
