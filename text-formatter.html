<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 Toolkit Hub</a>
      <div class="flex items-center gap-3">
        <a href="/ko/text-formatter" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">Korean</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Text & Content</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Text Case & Formatter</h1>
      <p class="text-xs text-slate-400">Convert string cases, remove extra whitespace, and generate clean URL slugs.</p>
    </div>

    <!-- Actions Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
      <button onclick="formatCase('upper')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">UPPERCASE</button>
      <button onclick="formatCase('lower')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">lowercase</button>
      <button onclick="formatCase('title')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">Title Case</button>
      <button onclick="formatCase('slug')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-cyan-400 transition">url-slug-format</button>
      <button onclick="formatCase('trim')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">Remove Extra Spaces</button>
      <button onclick="formatCase('no-breaks')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">Remove Line Breaks</button>
      <button onclick="formatCase('snake')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">snake_case</button>
      <button onclick="formatCase('camel')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">camelCase</button>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50 text-xs">
        <span id="charCount" class="text-slate-400">0 characters</span>
        <div class="flex gap-2">
          <button onclick="undo()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">Undo</button>
          <button onclick="clearText()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">Clear</button>
          <button onclick="copyText()" id="copyBtn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">Copy</button>
        </div>
      </div>
      <textarea id="textInput" placeholder="Enter text to format..." class="w-full h-80 p-4 bg-transparent text-sm text-slate-200 focus:outline-none resize-y leading-relaxed font-mono"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Part of the StarSign16 Ecosystem. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">Main Hub</a></p>
  </footer>

  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const copyBtn = document.getElementById('copyBtn');
    let history = [];

    function saveState() {
      if (history.length === 0 || history[history.length - 1] !== textInput.value) {
        history.push(textInput.value);
        if (history.length > 20) history.shift();
      }
    }

    function formatCase(type) {
      if (!textInput.value) return;
      saveState();
      let text = textInput.value;

      switch(type) {
        case 'upper': text = text.toUpperCase(); break;
        case 'lower': text = text.toLowerCase(); break;
        case 'title': text = text.replace(/\b\w/g, l => l.toUpperCase()); break;
        case 'slug':
          text = text.toLowerCase().trim()
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .replace(/^-+|-+$/g, '');
          break;
        case 'trim': text = text.replace(/[ \t]+/g, ' ').trim(); break;
        case 'no-breaks': text = text.replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim(); break;
        case 'snake':
          text = text.trim().toLowerCase().replace(/\s+/g, '_');
          break;
        case 'camel':
          text = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
          break;
      }
      textInput.value = text;
      updateStats();
    }

    function undo() {
      if (history.length > 0) {
        textInput.value = history.pop();
        updateStats();
      }
    }

    function updateStats() {
      charCount.innerText = `${textInput.value.length} characters`;
    }

    function clearText() {
      saveState();
      textInput.value = '';
      updateStats();
      textInput.focus();
    }

    function copyText() {
      if (!textInput.value) return;
      navigator.clipboard.writeText(textInput.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => copyBtn.innerText = 'Copy', 1500);
    }

    textInput.addEventListener('input', updateStats);
  </script>
</body>
</html>
