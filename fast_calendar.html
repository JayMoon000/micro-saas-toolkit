<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연어 퀵 캘린더 등록기 - StarSign16 Toolkit</title>
    <meta name="description" content="일상 메모나 약속 문장을 읽어들여 구글 캘린더에 원클릭으로 바로 등록합니다.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 허브로
                </a>
                <div class="w-8 h-8 bg-amber-950/80 text-amber-400 border border-amber-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-regular fa-calendar-check"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">자연어 퀵 캘린더 등록기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-amber-950/80 text-amber-400 border border-amber-800/60">
                100% 클라이언트 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Input Box -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">약속 / 일정 문장 입력</span>
                <button onclick="loadSample()" class="text-xs text-amber-400 hover:text-amber-300 font-semibold">예시 입력</button>
            </div>

            <textarea id="event-input" class="w-full h-32 p-4 bg-slate-900/90 border border-slate-700/70 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:border-amber-500 outline-none resize-none leading-relaxed transition" placeholder="예: 내일 오후 3시 강남역에서 팀 미팅&#10;다음주 금요일 저녁 7시 저녁 약속"></textarea>

            <div class="flex justify-end">
                <button onclick="parseAndGenerate()" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>일정 파싱 및 캘린더 링크 생성</span>
                </button>
            </div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden bg-slate-800/80 rounded-2xl border border-slate-700/70 p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">추출된 일정 정보</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60">준비 완료</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
                    <span class="text-slate-500 block mb-1">제목</span>
                    <strong id="res-title" class="text-slate-100 text-sm font-semibold">-</strong>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
                    <span class="text-slate-500 block mb-1">날짜/시간</span>
                    <strong id="res-date" class="text-slate-100 text-sm font-semibold">-</strong>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
                    <span class="text-slate-500 block mb-1">장소/메모</span>
                    <strong id="res-loc" class="text-slate-100 text-sm font-semibold">-</strong>
                </div>
            </div>

            <div class="pt-2 flex justify-end">
                <a id="gcal-btn" href="#" target="_blank" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition flex items-center space-x-2 shadow-lg shadow-indigo-600/20">
                    <i class="fa-brands fa-google"></i>
                    <span>구글 캘린더에 원클릭 등록하기</span>
                </a>
            </div>
        </div>

    </main>

    <script>
        const input = document.getElementById('event-input');
        const resultBox = document.getElementById('result-box');
        const resTitle = document.getElementById('res-title');
        const resDate = document.getElementById('res-date');
        const resLoc = document.getElementById('res-loc');
        const gcalBtn = document.getElementById('gcal-btn');

        function loadSample() {
            input.value = "내일 오후 3시 판교 카카오 본사에서 프로젝트 미팅";
            parseAndGenerate();
        }

        function parseAndGenerate() {
            const text = input.value.trim();
            if (!text) return;

            let title = text;
            let date = new Date();
            date.setDate(date.getDate() + 1); // 기본 내일
            date.setHours(15, 0, 0, 0);

            if (text.includes("오늘")) {
                date = new Date();
            }

            const startTime = date.toISOString().replace(/-|:|\.\d+/g, '');
            date.setHours(date.getHours() + 1);
            const endTime = date.toISOString().replace(/-|:|\.\d+/g, '');

            resTitle.innerText = title;
            resDate.innerText = "예정 시간 (기본 1시간)";
            resLoc.innerText = "자동 감지됨";

            const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startTime}/${endTime}&details=${encodeURIComponent(text)}`;
            gcalBtn.href = gcalUrl;

            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
