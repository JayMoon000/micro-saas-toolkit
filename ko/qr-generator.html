<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarSign16 툴킷 - 초고속 무료 QR 코드 생성기</title>
  <meta name="description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/qr-code-generator">
  
  <meta property="og:title" content="StarSign16 툴킷 - 초고속 무료 QR 코드 생성기">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/qr-code-generator">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/qr-code-generator" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full flex flex-col items-center">
    <div class="w-full mb-6 text-center">
      <div class="inline-flex items-center gap-2 mb-2">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">유틸리티</span>
      </div>
      <h1 class="text-2xl font-bold text-white">초고속 무료 QR 코드 생성기</h1>
      <p class="text-xs text-slate-400 mt-1">입력 즉시 브라우저에서 생성되며 서버로 데이터가 전송되지 않습니다.</p>
    </div>

    <div class="w-full max-w-xl bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col items-center space-y-6">
      <div class="w-full">
        <label for="qrInput" class="block text-xs font-semibold text-slate-400 mb-2">URL 또는 텍스트 입력</label>
        <input 
          type="text" 
          id="qrInput" 
          placeholder="https://starsign16.com" 
          value="https://starsign16.com"
          class="w-full p-3.5 bg-slate-900 text-slate-100 border border-slate-800 rounded-xl focus:outline-none focus:border-cyan-500 font-mono text-sm"
        />
      </div>

      <!-- QR 렌더링 영역 (흰색 패딩 박스) -->
      <div class="p-4 bg-white rounded-xl shadow-inner flex items-center justify-center min-h-[220px] min-w-[220px]">
        <div id="qrcode"></div>
      </div>

      <!-- 다운로드 버튼 -->
      <button 
        onclick="downloadQR()" 
        id="downloadBtn" 
        class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 text-sm"
      >
        QR 코드 이미지 다운로드 (PNG)
      </button>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const qrInput = document.getElementById('qrInput');
    const qrContainer = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('downloadBtn');
    let qrInstance = null;

    function generateQRCode() {
      const text = qrInput.value.trim();
      qrContainer.innerHTML = ''; // 캔버스 초기화

      if (!text) {
        return;
      }

      qrInstance = new QRCode(qrContainer, {
        text: text,
        width: 200,
        height: 200,
        colorDark: "#020617",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQR() {
      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');

      let dataUrl = null;
      if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) return;

      const link = document.createElement('a');
      link.download = 'starsign16_qrcode.png';
      link.href = dataUrl;
      link.click();

      downloadBtn.innerText = '✅ 다운로드 완료!';
      setTimeout(() => downloadBtn.innerText = 'QR 코드 이미지 다운로드 (PNG)', 1500);
    }

    qrInput.addEventListener('input', generateQRCode);
    window.addEventListener('DOMContentLoaded', generateQRCode);
  </script>
</body>
</html>
