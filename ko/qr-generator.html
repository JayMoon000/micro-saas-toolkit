<!DOCTYPE html>
<html lang="ko">
<head>

  <title>StarSign16 툴킷 - 100% 무료 브라우저 도구</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="canonical" href="https://tool.starsign16.com/ko/qr-generator.html">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition flex items-center gap-1">
        <span>←</span> <span>StarSign16 툴킷 허브</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/qr-generator" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">생활 & 비즈니스</span>
      </div>
      <h1 class="text-2xl font-bold text-white">QR 코드 생성기</h1>
      <p class="text-xs text-slate-400">웹링크, 텍스트, 와이파이 간편 연결용 QR코드를 브라우저에서 즉시 렌더링하고 다운로드합니다.</p>
    </div>

    <div class="flex gap-2 mb-6 border-b border-slate-800 pb-px">
      <button onclick="setType('url')" id="typeUrlBtn" class="px-4 py-2 text-xs font-bold border-b-2 border-cyan-500 text-cyan-400 transition">웹사이트 링크 (URL)</button>
      <button onclick="setType('text')" id="typeTextBtn" class="px-4 py-2 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">일반 텍스트</button>
      <button onclick="setType('wifi')" id="typeWifiBtn" class="px-4 py-2 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">와이파이 (Wi-Fi) 연결</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <div class="md:col-span-7 space-y-4">
        <div id="standardInputGroup" class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
          <label id="inputLabel" class="text-xs font-semibold text-slate-400 block mb-1.5">연결할 웹사이트 링크 (URL)</label>
          <input type="text" id="qrText" placeholder="https://starsign16.com" value="https://starsign16.com" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-cyan-300 font-mono focus:outline-none focus:border-cyan-500" / aria-label="Input field">
        </div>

        <div id="wifiInputGroup" class="hidden bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">와이파이 이름 (SSID)</label>
            <input type="text" id="wifiSsid" placeholder="예: My_Home_5G" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" / aria-label="Input field">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">비밀번호</label>
            <input type="text" id="wifiPass" placeholder="예: password1234" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" / aria-label="Input field">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">보안 암호화 유형</label>
            <select id="wifiType" class="w-full p-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-300 focus:outline-none font-mono">
              <option value="WPA">WPA/WPA2/WPA3 (표준)</option>
              <option value="WEP">WEP</option>
              <option value="nopass">개방형 (비밀번호 없음)</option>
            </select>
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 text-xs">
          <span class="font-semibold text-slate-400 block">QR 색상 커스텀</span>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-slate-500 block mb-1">QR 패턴 색상</label>
              <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-lg">
                <input type="color" id="qrDark" value="#000000" class="w-7 h-7 rounded border-0 bg-transparent cursor-pointer" />
                <span id="darkHex" class="font-mono text-slate-300 text-[11px]">#000000</span>
              </div>
            </div>
            <div>
              <label class="text-slate-500 block mb-1">배경 색상</label>
              <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-lg">
                <input type="color" id="qrLight" value="#ffffff" class="w-7 h-7 rounded border-0 bg-transparent cursor-pointer" />
                <span id="lightHex" class="font-mono text-slate-300 text-[11px]">#ffffff</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="md:col-span-5 flex flex-col">
        <div class="bg-slate-950 border border-slate-800 p-6 rounded-xl flex flex-col items-center justify-center flex-1">
          <div class="p-4 bg-white rounded-xl shadow-lg mb-4 flex items-center justify-center min-w-[210px] min-h-[210px]">
            <div id="qrcode"></div>
          </div>
          <button onclick="downloadQR()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2">
            <span>PNG 이미지 다운로드</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    let currentType = 'url';
    let qrcode = null;

    const qrContainer = document.getElementById('qrcode');
    const qrText = document.getElementById('qrText');
    const inputLabel = document.getElementById('inputLabel');
    const standardInputGroup = document.getElementById('standardInputGroup');
    const wifiInputGroup = document.getElementById('wifiInputGroup');
    const wifiSsid = document.getElementById('wifiSsid');
    const wifiPass = document.getElementById('wifiPass');
    const wifiType = document.getElementById('wifiType');
    const qrDark = document.getElementById('qrDark');
    const qrLight = document.getElementById('qrLight');
    const darkHex = document.getElementById('darkHex');
    const lightHex = document.getElementById('lightHex');

    function setType(type) {
      currentType = type;
      ['url', 'text', 'wifi'].forEach(t => {
        const btn = document.getElementById(`type${t.charAt(0).toUpperCase() + t.slice(1)}Btn`);
        if (t === type) {
          btn.className = 'px-4 py-2 text-xs font-bold border-b-2 border-cyan-500 text-cyan-400 transition';
        } else {
          btn.className = 'px-4 py-2 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        }
      });

      if (type === 'wifi') {
        standardInputGroup.classList.add('hidden');
        wifiInputGroup.classList.remove('hidden');
      } else {
        wifiInputGroup.classList.add('hidden');
        standardInputGroup.classList.remove('hidden');
        inputLabel.innerText = type === 'url' ? '연결할 웹사이트 링크 (URL)' : '입력할 일반 텍스트';
        qrText.placeholder = type === 'url' ? 'https://starsign16.com' : '텍스트 내용을 입력하세요...';
      }
      renderQR();
    }

    function getPayload() {
      if (currentType === 'wifi') {
        const ssid = wifiSsid.value.trim() || 'MyWiFi';
        const pass = wifiPass.value.trim();
        const type = wifiType.value;
        return `WIFI:S:${ssid};T:${type};P:${pass};;`;
      }
      return qrText.value.trim() || 'https://starsign16.com';
    }

    function renderQR() {
      qrContainer.innerHTML = '';
      const payload = getPayload();

      qrcode = new QRCode(qrContainer, {
        text: payload,
        width: 180,
        height: 180,
        colorDark: qrDark.value,
        colorLight: qrLight.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQR() {
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');
      let dataUrl = '';

      if (img && img.src) {
        dataUrl = img.src;
      } else if (canvas) {
        dataUrl = canvas.toDataURL('image/png');
      }

      if (!dataUrl) return;

      const link = document.createElement('a');
      link.download = 'starsign16-qrcode.png';
      link.href = dataUrl;
      link.click();
    }

    qrText.addEventListener('input', renderQR);
    wifiSsid.addEventListener('input', renderQR);
    wifiPass.addEventListener('input', renderQR);
    wifiType.addEventListener('change', renderQR);

    qrDark.addEventListener('input', (e) => {
      darkHex.innerText = e.target.value;
      renderQR();
    });

    qrLight.addEventListener('input', (e) => {
      lightHex.innerText = e.target.value;
      renderQR();
    });

    renderQR();
  </script>
</body>
</html>
