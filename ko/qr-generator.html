<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarSign16 툴킷 - 멀티 타입 초고속 QR 코드 생성기</title>
  <meta name="description" content="와이파이(Wi-Fi), 연락처(vCard), 웹주소, 이메일 QR 코드를 서버 전송 없이 즉시 생성합니다.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/qr-generator">
  
  <meta property="og:title" content="StarSign16 툴킷 - 멀티 타입 초고속 QR 코드 생성기">
  <meta property="og:description" content="와이파이(Wi-Fi), 연락처(vCard), 웹주소, 이메일 QR 코드를 서버 전송 없이 즉시 생성합니다.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/qr-generator">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/qr-generator" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full flex flex-col items-center">
    <div class="w-full mb-6 text-center">
      <div class="inline-flex items-center gap-2 mb-2">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">유틸리티</span>
      </div>
      <h1 class="text-2xl font-bold text-white">멀티 타입 QR 코드 생성기</h1>
      <p class="text-xs text-slate-400 mt-1">웹 링크, 와이파이 간편접속, 전자명함(vCard), 이메일을 브라우저에서 1초 만에 생성합니다.</p>
    </div>

    <div class="w-full max-w-2xl bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row gap-6">
      
      <!-- 입력 폼 영역 (멀티 탭) -->
      <div class="flex-1 space-y-4">
        <!-- 탭 네비게이션 -->
        <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-medium">
          <button onclick="switchTab('url')" id="tab-url" class="py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold transition">웹 링크/텍스트</button>
          <button onclick="switchTab('wifi')" id="tab-wifi" class="py-2 rounded-lg text-slate-400 hover:text-slate-200 transition">와이파이</button>
          <button onclick="switchTab('vcard')" id="tab-vcard" class="py-2 rounded-lg text-slate-400 hover:text-slate-200 transition">전자명함</button>
          <button onclick="switchTab('email')" id="tab-email" class="py-2 rounded-lg text-slate-400 hover:text-slate-200 transition">이메일</button>
        </div>

        <!-- 1. URL / Text 탭 -->
        <div id="panel-url" class="tab-panel space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">웹사이트 URL 또는 텍스트</label>
            <input type="text" id="urlInput" placeholder="https://tool.starsign16.com/ko" value="https://tool.starsign16.com/ko" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 font-mono text-slate-200" oninput="generateQR()">
          </div>
        </div>

        <!-- 2. Wi-Fi 탭 -->
        <div id="panel-wifi" class="tab-panel space-y-3 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">와이파이 이름 (SSID)</label>
            <input type="text" id="wifiSsid" placeholder="공유기_SSID_이름" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">비밀번호</label>
            <input type="text" id="wifiPass" placeholder="wifi_password_123" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">보안 암호화 방식</label>
            <select id="wifiType" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" onchange="generateQR()">
              <option value="WPA">WPA/WPA2 (일반 권장)</option>
              <option value="WEP">WEP</option>
              <option value="nopass">비밀번호 없음 (개방형)</option>
            </select>
          </div>
        </div>

        <!-- 3. vCard 탭 -->
        <div id="panel-vcard" class="tab-panel space-y-3 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">이름 / 상호</label>
            <input type="text" id="vcardName" placeholder="문제욱 (Jay)" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">연락처 전화번호</label>
            <input type="text" id="vcardPhone" placeholder="010-0000-0000" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">이메일 주소</label>
            <input type="email" id="vcardEmail" placeholder="contact@starsign16.com" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
        </div>

        <!-- 4. Email 탭 -->
        <div id="panel-email" class="tab-panel space-y-3 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">수신자 이메일</label>
            <input type="email" id="emailTo" placeholder="contact@starsign16.com" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">기본 메일 제목</label>
            <input type="text" id="emailSubject" placeholder="StarSign16 문의사항" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-200" oninput="generateQR()">
          </div>
        </div>
      </div>

      <!-- 우측 QR 미리보기 및 다운로드 -->
      <div class="flex flex-col items-center justify-between border-t md:border-t-0 md:border-l border-slate-800 pt-6 md:pt-0 md:pl-6 space-y-4">
        <div class="p-3.5 bg-white rounded-xl shadow-inner flex items-center justify-center min-h-[190px] min-w-[190px]">
          <div id="qrcode"></div>
        </div>

        <button onclick="downloadQR()" id="downloadBtn" class="w-full py-2.5 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl transition duration-200 shadow-md shadow-cyan-500/10 text-xs">
          QR 코드 다운로드 (PNG)
        </button>
      </div>

    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    let currentTab = 'url';
    const qrContainer = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('downloadBtn');

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['url', 'wifi', 'vcard', 'email'];
      
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const panel = document.getElementById(`panel-${t}`);
        if (t === tab) {
          btn.className = "py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold transition";
          panel.classList.remove('hidden');
        } else {
          btn.className = "py-2 rounded-lg text-slate-400 hover:text-slate-200 transition";
          panel.classList.add('hidden');
        }
      });
      generateQR();
    }

    function getQRText() {
      if (currentTab === 'url') {
        return document.getElementById('urlInput').value.trim() || 'https://tool.starsign16.com/ko';
      } else if (currentTab === 'wifi') {
        const ssid = document.getElementById('wifiSsid').value.trim();
        const pass = document.getElementById('wifiPass').value.trim();
        const type = document.getElementById('wifiType').value;
        if (!ssid) return 'WIFI:S:StarSign16_WiFi;T:WPA;P:;;';
        return `WIFI:S:${ssid};T:${type};P:${pass};;`;
      } else if (currentTab === 'vcard') {
        const name = document.getElementById('vcardName').value.trim() || 'Jay';
        const phone = document.getElementById('vcardPhone').value.trim();
        const email = document.getElementById('vcardEmail').value.trim();
        return `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
      } else if (currentTab === 'email') {
        const to = document.getElementById('emailTo').value.trim();
        const sub = encodeURIComponent(document.getElementById('emailSubject').value.trim());
        return `mailto:${to}?subject=${sub}`;
      }
      return 'https://tool.starsign16.com/ko';
    }

    function generateQR() {
      const text = getQRText();
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: text,
        width: 170,
        height: 170,
        colorDark: "#020617",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function downloadQR() {
      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');
      const dataUrl = canvas ? canvas.toDataURL("image/png") : (img ? img.src : null);

      if (!dataUrl) return;

      const link = document.createElement('a');
      link.download = `starsign16_qr_${currentTab}.png`;
      link.href = dataUrl;
      link.click();

      downloadBtn.innerText = '✅ 다운로드 완료!';
      setTimeout(() => downloadBtn.innerText = 'QR 코드 다운로드 (PNG)', 1500);
    }

    window.addEventListener('DOMContentLoaded', generateQR);
  </script>
</body>
</html>
