<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarSign16 툴킷 - 100% 무료 브라우저 도구</title>
  <meta name="description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/json-formatter">
  
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/json-formatter">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6LFL2P1WRN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6LFL2P1WRN');
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/json-formatter" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full flex flex-col">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">개발 & 데이터</span>
      </div>
      <h1 class="text-2xl font-bold text-white">JSON 포매터 & 문법 검사기</h1>
      <p class="text-xs text-slate-400">JSON 정렬(줄바꿈 들여쓰기), 1줄 압축(Minify), 문법 에러 위치를 실시간 검증합니다.</p>
    </div>

    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-t-xl flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="formatJSON(2)" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">✨ 정렬 (2칸 들여쓰기)</button>
        <button onclick="formatJSON(4)" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">✨ 정렬 (4칸 들여쓰기)</button>
        <button onclick="minifyJSON()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded font-medium transition">🗜️ 1줄 압축 (Minify)</button>
        <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded transition">샘플 불러오기</button>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearAll()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium transition">지우기</button>
        <button onclick="copyOutput()" id="copyBtn" class="px-3.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-medium transition">결과 복사</button>
      </div>
    </div>

    <div id="statusBanner" class="hidden px-4 py-2 text-xs font-mono border-x border-slate-800 transition-all"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border border-slate-800 rounded-b-xl overflow-hidden min-h-[460px] flex-1">
      <div class="flex flex-col bg-slate-950 border-b md:border-b-0 md:border-r border-slate-800">
        <div class="px-3 py-1.5 bg-slate-900/60 border-b border-slate-800 text-[11px] font-mono text-slate-400 flex justify-between">
          <span>원본 JSON 입력</span>
          <span id="inputStats" class="text-slate-500">0 글자</span>
        </div>
        <textarea id="rawInput" placeholder="정렬되지 않은 JSON 텍스트를 붙여넣으세요..." class="flex-1 w-full p-4 bg-transparent text-sm text-slate-200 focus:outline-none font-mono leading-relaxed resize-none h-72 md:h-full"></textarea>
      </div>

      <div class="flex flex-col bg-slate-950/60">
        <div class="px-3 py-1.5 bg-slate-900/60 border-b border-slate-800 text-[11px] font-mono text-slate-400 flex justify-between">
          <span>정렬 및 검증 결과</span>
          <span id="outputStats" class="text-slate-500">0 글자</span>
        </div>
        <textarea id="formattedOutput" readonly placeholder="정렬된 JSON이 이곳에 표시됩니다..." class="flex-1 w-full p-4 bg-transparent text-sm text-cyan-300 focus:outline-none font-mono leading-relaxed resize-none h-72 md:h-full"></textarea>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const rawInput = document.getElementById('rawInput');
    const formattedOutput = document.getElementById('formattedOutput');
    const statusBanner = document.getElementById('statusBanner');
    const inputStats = document.getElementById('inputStats');
    const outputStats = document.getElementById('outputStats');
    const copyBtn = document.getElementById('copyBtn');

    function setStatus(msg, isError = false) {
      statusBanner.classList.remove('hidden', 'bg-emerald-950/60', 'text-emerald-400', 'border-emerald-800/80', 'bg-rose-950/60', 'text-rose-400', 'border-rose-800/80');
      if (isError) {
        statusBanner.classList.add('bg-rose-950/60', 'text-rose-400', 'border-rose-800/80');
        statusBanner.innerHTML = `⚠️ <strong>문법 오류:</strong> ${msg}`;
      } else {
        statusBanner.classList.add('bg-emerald-950/60', 'text-emerald-400', 'border-emerald-800/80');
        statusBanner.innerHTML = `✓ <strong>유효한 JSON:</strong> ${msg}`;
      }
    }

    function formatJSON(indent = 2) {
      const val = rawInput.value.trim();
      if (!val) {
        formattedOutput.value = '';
        statusBanner.classList.add('hidden');
        updateStats();
        return;
      }

      try {
        const parsed = JSON.parse(val);
        const res = JSON.stringify(parsed, null, indent);
        formattedOutput.value = res;
        setStatus(`정상 파싱 완료 (${indent}칸 들여쓰기 적용)`, false);
      } catch (err) {
        formattedOutput.value = '';
        setStatus(err.message, true);
      }
      updateStats();
    }

    function minifyJSON() {
      const val = rawInput.value.trim();
      if (!val) return;

      try {
        const parsed = JSON.parse(val);
        const res = JSON.stringify(parsed);
        formattedOutput.value = res;
        setStatus('공백과 줄바꿈이 제거된 1줄 압축 완료', false);
      } catch (err) {
        formattedOutput.value = '';
        setStatus(err.message, true);
      }
      updateStats();
    }

    function loadSample() {
      const sample = {
        name: "StarSign16 툴킷",
        version: "1.0.0",
        clientSide: true,
        features: ["JSON 포매터", "Base64 도구", "정규식 검사기", "URL 파서"],
        serverCost: "0원"
      };
      rawInput.value = JSON.stringify(sample);
      formatJSON(2);
    }

    function clearAll() {
      rawInput.value = '';
      formattedOutput.value = '';
      statusBanner.classList.add('hidden');
      updateStats();
      rawInput.focus();
    }

    function copyOutput() {
      if (!formattedOutput.value) return;
      navigator.clipboard.writeText(formattedOutput.value);
      copyBtn.innerText = '복사완료!';
      setTimeout(() => copyBtn.innerText = '결과 복사', 1500);
    }

    function updateStats() {
      inputStats.innerText = `${rawInput.value.length} 글자`;
      outputStats.innerText = `${formattedOutput.value.length} 글자`;
    }

    rawInput.addEventListener('input', () => {
      updateStats();
      if (rawInput.value.trim()) {
        formatJSON(2);
      } else {
        formattedOutput.value = '';
        statusBanner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
