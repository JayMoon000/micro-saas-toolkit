<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarSign16 툴킷 - 100% 무료 브라우저 도구</title>
  <meta name="description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/image-resizer">
  
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/image-resizer">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/image-resizer" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">이미지 & 미디어</span>
      </div>
      <h1 class="text-2xl font-bold text-white">이미지 리사이저</h1>
      <p class="text-xs text-slate-400">화질 손실 없이 이미지 해상도(px)와 축소/확대 비율을 조정합니다.</p>
    </div>

    <div
      id="dropZone"
      onclick="document.getElementById('fileInput').click()"
      class="border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-slate-950/60 rounded-xl p-8 text-center cursor-pointer transition mb-6"
    >
      <input type="file" id="fileInput" accept="image/*" class="hidden" / aria-label="도구 검색 및 입력">
      <div class="text-3xl mb-2">📐</div>
      <p class="text-sm font-semibold text-slate-200 mb-1">크기를 바꿀 이미지를 클릭하거나 드래그하세요</p>
      <p class="text-xs text-slate-500">PNG, JPG, WebP 지원 (100% 로컬 연산)</p>
    </div>

    <div id="workspace" class="hidden space-y-6">
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">가로 너비 (Width px)</label>
            <input type="number" id="widthInput" class="w-full p-2 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" / aria-label="도구 검색 및 입력">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">세로 높이 (Height px)</label>
            <input type="number" id="heightInput" class="w-full p-2 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" / aria-label="도구 검색 및 입력">
          </div>
          <div class="flex items-end">
            <label class="flex items-center gap-2 p-2 bg-slate-900 border border-slate-800 rounded cursor-pointer text-xs text-slate-300 w-full">
              <input type="checkbox" id="lockAspect" checked class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0" / aria-label="도구 검색 및 입력">
              <span>가로세로 비율 유지 잠금</span>
            </label>
          </div>
        </div>

        <div class="flex items-center gap-2 text-xs">
          <span class="text-slate-500">비율 프리셋:</span>
          <button onclick="applyPreset(0.25)" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 rounded border border-slate-800 text-slate-300">25%</button>
          <button onclick="applyPreset(0.50)" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 rounded border border-slate-800 text-slate-300">50%</button>
          <button onclick="applyPreset(0.75)" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 rounded border border-slate-800 text-slate-300">75%</button>
          <button onclick="applyPreset(1.0)" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 rounded border border-slate-800 text-slate-300">원본 (100%)</button>
        </div>
      </div>

      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center">
        <div class="text-xs text-slate-400 mb-3 flex gap-4">
          <span>최종 해상도: <strong id="resStats" class="text-cyan-400 font-mono">0 x 0</strong></span>
        </div>
        <div class="w-full h-80 bg-slate-900/50 rounded-lg mb-4 flex items-center justify-center p-4 border border-slate-800/80 overflow-hidden">
          <canvas id="previewCanvas" class="rounded shadow transition-all duration-200 origin-center"></canvas>
        </div>
        <a id="downloadBtn" download="resized-image.png" class="px-8 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold text-center transition cursor-pointer">
          리사이즈된 이미지 다운로드
        </a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    let originalImg = null;
    let aspectRatio = 1;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const workspace = document.getElementById('workspace');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const lockAspect = document.getElementById('lockAspect');
    const previewCanvas = document.getElementById('previewCanvas');
    const resStats = document.getElementById('resStats');
    const downloadBtn = document.getElementById('downloadBtn');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-cyan-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return alert('이미지 파일을 업로드해 주세요.');
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          originalImg = img;
          aspectRatio = img.width / img.height;
          widthInput.value = img.width;
          heightInput.value = img.height;
          workspace.classList.remove('hidden');
          renderCanvas();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    widthInput.addEventListener('input', () => {
      if (lockAspect.checked && originalImg) {
        heightInput.value = Math.round(widthInput.value / aspectRatio);
      }
      renderCanvas();
    });

    heightInput.addEventListener('input', () => {
      if (lockAspect.checked && originalImg) {
        widthInput.value = Math.round(heightInput.value * aspectRatio);
      }
      renderCanvas();
    });

    function applyPreset(scale) {
      if (!originalImg) return;
      widthInput.value = Math.round(originalImg.width * scale);
      heightInput.value = Math.round(originalImg.height * scale);
      renderCanvas();
    }

    function renderCanvas() {
      if (!originalImg) return;
      const targetW = parseInt(widthInput.value) || 1;
      const targetH = parseInt(heightInput.value) || 1;

      previewCanvas.width = targetW;
      previewCanvas.height = targetH;
      const ctx = previewCanvas.getContext('2d');
      ctx.drawImage(originalImg, 0, 0, targetW, targetH);

      const scaleRatio = targetW / originalImg.width;
      const baseDisplayMax = 260;
      
      let baseW, baseH;
      if (aspectRatio >= 1) {
        baseW = baseDisplayMax;
        baseH = baseDisplayMax / aspectRatio;
      } else {
        baseH = baseDisplayMax;
        baseW = baseDisplayMax * aspectRatio;
      }

      previewCanvas.style.width = `${Math.max(20, Math.round(baseW * scaleRatio))}px`;
      previewCanvas.style.height = `${Math.max(20, Math.round(baseH * scaleRatio))}px`;

      resStats.innerText = `${targetW} x ${targetH} px`;
      downloadBtn.href = previewCanvas.toDataURL('image/png');
    }
  </script>
</body>
</html>
