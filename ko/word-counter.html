  <meta property="og:type" content="website">
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/word-counter" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">텍스트 & 콘텐츠</span>
      </div>
      <h1 class="text-2xl font-bold text-white">글자수 & 바이트 계산기</h1>
      <p class="text-xs text-slate-400">자기소개서, 블로그 원고 작성 시 실시간 글자수 및 UTF-8 바이트를 측정합니다.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">전체 글자수 (공백포함)</span>
        <span id="charCount" class="text-3xl font-bold font-mono text-cyan-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">공백 제외 글자수</span>
        <span id="charNoSpaceCount" class="text-3xl font-bold font-mono text-cyan-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">단어 수 (어절)</span>
        <span id="wordCount" class="text-3xl font-bold font-mono text-indigo-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">용량 (UTF-8 Byte)</span>
        <span id="byteCount" class="text-3xl font-bold font-mono text-indigo-400">0</span>
      </div>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-4">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50 text-xs">
        <div class="flex gap-4 text-slate-400">
          <span>예상 읽기: <strong id="readingTime" class="text-slate-200">0초</strong></span>
          <span>원고지: <strong id="wonjiCount" class="text-slate-200">0장</strong></span>
        </div>
        <div class="flex gap-2">
          <button onclick="clearText()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">지우기</button>
          <button onclick="copyText()" id="copyBtn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">복사</button>
        </div>
      </div>
      <textarea id="textInput" placeholder="텍스트를 입력하거나 붙여넣으세요..." class="w-full h-72 p-4 bg-transparent text-sm text-slate-200 focus:outline-none resize-y leading-relaxed font-sans"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const charNoSpaceCount = document.getElementById('charNoSpaceCount');
    const wordCount = document.getElementById('wordCount');
    const byteCount = document.getElementById('byteCount');
    const readingTime = document.getElementById('readingTime');
    const wonjiCount = document.getElementById('wonjiCount');
    const copyBtn = document.getElementById('copyBtn');

    function updateMetrics() {
      const text = textInput.value;
      charCount.innerText = text.length.toLocaleString();
      charNoSpaceCount.innerText = text.replace(/\s/g, '').length.toLocaleString();

      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCount.innerText = words.toLocaleString();

      const bytes = new Blob([text]).size;
      byteCount.innerText = bytes.toLocaleString();

      const readMinutes = text.length / 500; // 한글 기준 1분 약 500자
      readingTime.innerText = readMinutes < 1 ? `${Math.ceil(readMinutes * 60)}초` : `${Math.ceil(readMinutes)}분`;
      wonjiCount.innerText = `${(text.length / 200).toFixed(1)}장`;
    }

    function clearText() {
      textInput.value = '';
      updateMetrics();
      textInput.focus();
    }

    function copyText() {
      if (!textInput.value) return;
      navigator.clipboard.writeText(textInput.value);
      copyBtn.innerText = '복사완료!';
      setTimeout(() => copyBtn.innerText = '복사', 1500);
    }

    textInput.addEventListener('input', updateMetrics);
  </script>
</body>
</html>
