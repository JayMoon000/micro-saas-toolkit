<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/markdown-previewer" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full flex flex-col">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">텍스트 & 콘텐츠</span>
      </div>
      <h1 class="text-2xl font-bold text-white">마크다운 실시간 에디터</h1>
      <p class="text-xs text-slate-400">마크다운 문법을 실시간으로 렌더링하고 HTML 태그로 즉시 변환합니다.</p>
    </div>

    <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-2.5 rounded-t-xl text-xs">
      <span class="text-slate-400 font-mono">분할 편집 화면</span>
      <div class="flex gap-2">
        <button onclick="copyHtml()" id="copyHtmlBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">HTML 태그 복사</button>
        <button onclick="copyMarkdown()" id="copyMdBtn" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">마크다운 복사</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border border-slate-800 rounded-b-xl overflow-hidden min-h-[480px] flex-1">
      <textarea id="mdInput" placeholder="마크다운을 입력하세요..." class="w-full h-80 md:h-full p-4 bg-slate-950 text-slate-200 focus:outline-none font-mono text-sm leading-relaxed resize-none border-b md:border-b-0 md:border-r border-slate-800"></textarea>
      <div id="previewArea" class="w-full h-80 md:h-full p-4 bg-slate-950/60 overflow-y-auto prose-custom text-sm"></div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const mdInput = document.getElementById('mdInput');
    const previewArea = document.getElementById('previewArea');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const copyMdBtn = document.getElementById('copyMdBtn');

    const sample = `# StarSign16 마이크로 툴킷
서버 비용 $0 기반의 **초경량 웹 유틸리티** 모음입니다.

## 핵심 특징
* 100% 브라우저 로컬 연산
* 회원가입 및 서버 전송 없음
* 즉각적인 렌더링 속도

> 개인정보를 안전하게 보호하는 업무 워크스페이스입니다.

\`\`\`javascript
const speed = "0.01s";
console.log("환영합니다 Jay!");
\`\`\`
`;

    function renderMarkdown() {
      previewArea.innerHTML = marked.parse(mdInput.value);
    }

    function copyHtml() {
      const html = marked.parse(mdInput.value);
      navigator.clipboard.writeText(html);
      copyHtmlBtn.innerText = 'HTML 복사완료!';
      setTimeout(() => copyHtmlBtn.innerText = 'HTML 태그 복사', 1500);
    }

    function copyMarkdown() {
      navigator.clipboard.writeText(mdInput.value);
      copyMdBtn.innerText = '마크다운 복사완료!';
      setTimeout(() => copyMdBtn.innerText = '마크다운 복사', 1500);
    }

    mdInput.addEventListener('input', renderMarkdown);
    mdInput.value = sample;
    renderMarkdown();
  </script>
</body>
