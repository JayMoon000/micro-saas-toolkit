<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3초 파스텔 차트 시각화기 - StarSign16 Toolkit</title>
  <meta name="description" content="엑셀, CSV 데이터를 붙여넣으면 감성적인 파스텔 막대/도넛/꺾은선 차트로 즉시 렌더링하고 다운로드합니다.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/olld_tools/visualizer">
  
  <meta property="og:title" content="3초 파스텔 차트 시각화기 - StarSign16 Toolkit">
  <meta property="og:description" content="엑셀, CSV 데이터를 붙여넣으면 감성적인 파스텔 막대/도넛/꺾은선 차트로 즉시 렌더링하고 다운로드합니다.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/olld_tools/visualizer">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 메인으로
                </a>
                <div class="w-8 h-8 bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">3초 파스텔 차트 시각화기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/60">
                100% 브라우저 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Controls Bar -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">차트 종류</label>
                    <div class="flex rounded-xl bg-slate-900 border border-slate-700 p-1 space-x-1">
                        <button onclick="setChartType('bar')" id="btn-type-bar" class="flex-1 py-1.5 rounded-lg bg-emerald-600 font-bold text-white shadow-xs transition">막대</button>
                        <button onclick="setChartType('line')" id="btn-type-line" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 font-medium transition">꺾은선</button>
                        <button onclick="setChartType('doughnut')" id="btn-type-doughnut" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 font-medium transition">도넛</button>
                        <button onclick="setChartType('pie')" id="btn-type-pie" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 font-medium transition">원형</button>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">파스텔 컬러 테마</label>
                    <select id="palette-select" onchange="updateChart()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 outline-none text-slate-200 font-medium">
                        <option value="cottonCandy">코튼 캔디 (핑크/바이올렛/스카이)</option>
                        <option value="nordicForest">노르딕 포레스트 (세이지/민트/올리브)</option>
                        <option value="warmSunset">선셋 피치 (살구/코랄/버터옐로우)</option>
                        <option value="modernIndigo">모던 라벤더 (라벤더/인디고/소프트그레이)</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">차트 제목</label>
                    <input type="text" id="chart-title-input" value="월별 매출 및 지출 현황" oninput="updateChart()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 outline-none focus:border-emerald-500 text-slate-200 transition" placeholder="차트 제목을 입력하세요" aria-label="Input field">
                </div>

                <div class="flex items-end space-x-2">
                    <button onclick="loadSampleData()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-bold transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-dice text-slate-400"></i>
                        <span>샘플 데이터 채우기</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
            <!-- Left: Input (5 cols) -->
            <div class="lg:col-span-5 bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">데이터 입력 (표 / CSV 붙여넣기)</span>
                        <button onclick="fileInput.click()" class="text-xs text-emerald-400 hover:text-emerald-300 font-semibold flex items-center space-x-1">
                            <i class="fa-solid fa-file-import"></i>
                            <span>파일 불러오기</span>
                        </button>
                        <input type="file" id="file-input" accept=".csv, .xlsx, .xls" class="hidden" aria-label="도구 검색 및 입력">
                    </div>
                    <p class="text-[11px] text-slate-500 mb-2 leading-relaxed">
                        첫 번째 열은 <strong>항목(X축)</strong>, 다음 열부터는 <strong>수치(Y축)</strong>로 자동 인식됩니다.
                    </p>
                    <textarea id="raw-data-input" class="w-full h-[400px] p-3.5 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-xs text-slate-200 focus:border-emerald-500 outline-none resize-none leading-relaxed transition" placeholder="항목&#9;매출&#9;지출&#10;1월&#9;450&#9;300&#10;2월&#9;520&#9;280&#10;3월&#9;610&#9;350&#10;4월&#9;580&#9;310"></textarea>
                </div>
                <div class="pt-3 border-t border-slate-700/60 mt-3 text-xs text-slate-400 flex justify-between">
                    <span>데이터 라인: <strong id="row-count" class="text-emerald-400 font-bold">0</strong>건</span>
                    <span class="text-[11px] text-slate-500">Tab / 콤마 자동 감지</span>
                </div>
            </div>

            <!-- Right: Chart Preview (7 cols) -->
            <div class="lg:col-span-7 bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div class="flex-1 flex flex-col">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">실시간 파스텔 차트</span>
                        <span class="text-[11px] text-slate-500">호버 시 상세 툴팁 표시</span>
                    </div>
                    <div class="flex-1 bg-slate-900/90 border border-slate-700/70 rounded-xl p-6 flex items-center justify-center relative min-h-[380px]">
                        <canvas id="chart-canvas"></canvas>
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-700/60 mt-4 flex items-center justify-between">
                    <span class="text-xs text-slate-500">블로그, 보고서 삽입용 고화질 추출</span>
                    <button onclick="downloadChartPNG()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-download"></i>
                        <span>고화질 PNG 다운로드 (2x)</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const rawDataInput = document.getElementById('raw-data-input');
        const chartTitleInput = document.getElementById('chart-title-input');
        const paletteSelect = document.getElementById('palette-select');
        const fileInput = document.getElementById('file-input');
        const rowCountEl = document.getElementById('row-count');
        const canvas = document.getElementById('chart-canvas');

        let currentChartType = 'bar';
        let chartInstance = null;

        const colorPalettes = {
            cottonCandy: ['rgba(244, 114, 182, 0.85)', 'rgba(167, 139, 250, 0.85)', 'rgba(96, 165, 250, 0.85)', 'rgba(52, 211, 153, 0.85)', 'rgba(251, 191, 36, 0.85)', 'rgba(251, 146, 60, 0.85)'],
            nordicForest: ['rgba(110, 164, 148, 0.85)', 'rgba(138, 182, 214, 0.85)', 'rgba(197, 168, 130, 0.85)', 'rgba(142, 139, 179, 0.85)', 'rgba(182, 204, 164, 0.85)', 'rgba(224, 187, 156, 0.85)'],
            warmSunset: ['rgba(251, 113, 133, 0.85)', 'rgba(251, 146, 60, 0.85)', 'rgba(250, 204, 21, 0.85)', 'rgba(248, 113, 113, 0.85)', 'rgba(232, 121, 249, 0.85)', 'rgba(244, 63, 94, 0.85)'],
            modernIndigo: ['rgba(99, 102, 241, 0.85)', 'rgba(129, 140, 248, 0.85)', 'rgba(148, 163, 184, 0.85)', 'rgba(56, 189, 248, 0.85)', 'rgba(168, 85, 247, 0.85)', 'rgba(71, 85, 105, 0.85)']
        };

        function setChartType(type) {
            currentChartType = type;
            ['bar', 'line', 'doughnut', 'pie'].forEach(t => {
                const btn = document.getElementById(`btn-type-${t}`);
                if (t === type) {
                    btn.className = "flex-1 py-1.5 rounded-lg bg-emerald-600 font-bold text-white shadow-xs transition";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 font-medium transition";
                }
            });
            updateChart();
        }

        function parseData(text) {
            const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
            if (lines.length === 0) return null;

            const delimiter = lines[0].includes('\t') ? '\t' : ',';
            const headers = lines[0].split(delimiter).map(h => h.trim());
            const labels = [];
            const datasetsData = [];

            const datasetCount = Math.max(1, headers.length - 1);
            for (let i = 0; i < datasetCount; i++) {
                datasetsData.push({
                    label: headers[i + 1] || `데이터 ${i + 1}`,
                    data: []
                });
            }

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(delimiter).map(c => c.trim().replace(/,/g, ''));
                if (row.length === 0 || !row[0]) continue;
                labels.push(row[0]);

                for (let d = 0; d < datasetCount; d++) {
                    const val = parseFloat(row[d + 1]);
                    datasetsData[d].data.push(isNaN(val) ? 0 : val);
                }
            }

            return { labels, datasetsData };
        }

        function updateChart() {
            const parsed = parseData(rawDataInput.value);
            if (!parsed || parsed.labels.length === 0) {
                if (chartInstance) chartInstance.destroy();
                rowCountEl.innerText = 0;
                return;
            }

            rowCountEl.innerText = parsed.labels.length;
            const colors = colorPalettes[paletteSelect.value] || colorPalettes.cottonCandy;
            const isPieOrDoughnut = currentChartType === 'pie' || currentChartType === 'doughnut';

            const datasets = parsed.datasetsData.map((ds, idx) => {
                if (isPieOrDoughnut) {
                    return {
                        label: ds.label,
                        data: ds.data,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#0f172a',
                        hoverOffset: 6
                    };
                } else {
                    const color = colors[idx % colors.length];
                    return {
                        label: ds.label,
                        data: ds.data,
                        backgroundColor: currentChartType === 'line' ? color.replace('0.85', '0.2') : color,
                        borderColor: color.replace('0.85', '1.0'),
                        borderWidth: 2,
                        borderRadius: currentChartType === 'bar' ? 8 : 0,
                        fill: currentChartType === 'line',
                        tension: 0.35,
                        pointBackgroundColor: '#0f172a',
                        pointBorderColor: color,
                        pointBorderWidth: 2,
                        pointRadius: 4
                    };
                }
            });

            if (chartInstance) chartInstance.destroy();

            const ctx = canvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: currentChartType,
                data: {
                    labels: parsed.labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: !!chartTitleInput.value,
                            text: chartTitleInput.value,
                            font: { size: 15, weight: 'bold', family: '-apple-system, sans-serif' },
                            color: '#f8fafc',
                            padding: { bottom: 18 }
                        },
                        legend: {
                            display: true,
                            position: isPieOrDoughnut ? 'right' : 'top',
                            labels: {
                                boxWidth: 12,
                                boxHeight: 12,
                                borderRadius: 4,
                                useBorderRadius: true,
                                font: { size: 11, family: '-apple-system, sans-serif' },
                                color: '#94a3b8',
                                padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 10,
                            cornerRadius: 8,
                            titleFont: { size: 11, weight: 'bold' },
                            bodyFont: { size: 11 }
                        }
                    },
                    scales: isPieOrDoughnut ? {} : {
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 11 }, color: '#64748b' }
                        },
                        y: {
                            grid: { color: '#1e293b' },
                            ticks: { font: { size: 11 }, color: '#64748b' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            if (file.name.endsWith('.csv')) {
                reader.onload = (evt) => {
                    rawDataInput.value = evt.target.result;
                    updateChart();
                };
                reader.readAsText(file, 'utf-8');
            } else {
                reader.onload = (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const csv = XLSX.utils.sheet_to_csv(firstSheet);
                    rawDataInput.value = csv;
                    updateChart();
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function loadSampleData() {
            chartTitleInput.value = "2026 분기별 서비스 이용자 현황";
            rawDataInput.value = `분기\t신규 유입\t재방문자\n1분기\t12400\t8500\n2분기\t18900\t14200\n3분기\t24500\t19800\n4분기\t31000\t26400`;
            updateChart();
        }

        function downloadChartPNG() {
            if (!chartInstance) return;
            const originalCanvas = chartInstance.canvas;
            const exportCanvas = document.createElement('canvas');
            const scale = 2;
            exportCanvas.width = originalCanvas.width * scale;
            exportCanvas.height = originalCanvas.height * scale;
            
            const expCtx = exportCanvas.getContext('2d');
            expCtx.fillStyle = '#0f172a';
            expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            expCtx.drawImage(originalCanvas, 0, 0, exportCanvas.width, exportCanvas.height);

            const link = document.createElement('a');
            link.download = `chart_${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        rawDataInput.addEventListener('input', updateChart);
        loadSampleData();
    </script>
</body>
</html>
