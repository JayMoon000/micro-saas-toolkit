<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노코드 플로우차트 메이커 - StarSign16 Toolkit</title>
  <meta name="description" content="블록 조립 방식으로 텍스트 순서도와 다이어그램을 3초 만에 만들고 PNG/SVG 고화질 이미지로 내보냅니다.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/olld_tools/flowchart_maker">
  
  <meta property="og:title" content="노코드 플로우차트 메이커 - StarSign16 Toolkit">
  <meta property="og:description" content="블록 조립 방식으로 텍스트 순서도와 다이어그램을 3초 만에 만들고 PNG/SVG 고화질 이미지로 내보냅니다.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/olld_tools/flowchart_maker">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">

  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6LFL2P1WRN');

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 메인으로
                </a>
                <div class="w-8 h-8 bg-indigo-950/80 text-indigo-400 border border-indigo-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-diagram-project"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">노코드 플로우차트 메이커</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-950/80 text-indigo-400 border border-indigo-800/60">
                블록 조립 에디터
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">

        <!-- Left Builder Pane -->
        <div class="w-full lg:w-5/12 bg-slate-800/80 border border-slate-700/70 rounded-2xl p-5 flex flex-col shadow-2xl">
            <div class="flex gap-2 pb-4 border-b border-slate-700/60 mb-4">
                <button onclick="addBlock('step')" class="flex-1 py-2.5 px-3 bg-indigo-950/80 hover:bg-indigo-900/80 border border-indigo-800/60 text-indigo-300 font-bold text-xs rounded-xl transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-square-plus"></i>
                    <span>일반 단계 추가</span>
                </button>
                <button onclick="addBlock('branch')" class="flex-1 py-2.5 px-3 bg-amber-950/80 hover:bg-amber-900/80 border border-amber-800/60 text-amber-300 font-bold text-xs rounded-xl transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-diamond"></i>
                    <span>조건 분기 추가</span>
                </button>
            </div>

            <!-- Block List Scrollable -->
            <div id="blockList" class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[560px]">
                <!-- Blocks rendered by JS -->
            </div>
        </div>

        <!-- Right Preview Pane -->
        <div class="w-full lg:w-7/12 bg-slate-800/80 border border-slate-700/70 rounded-2xl p-5 flex flex-col justify-between shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">실시간 플로우차트</span>
                <div class="flex items-center space-x-2">
                    <button onclick="resetBlocks()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold rounded-lg transition">
                        초기화
                    </button>
                    <button onclick="downloadSVG()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition flex items-center space-x-1">
                        <i class="fa-solid fa-code text-indigo-400"></i>
                        <span>SVG</span>
                    </button>
                    <button onclick="downloadPNG()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-image"></i>
                        <span>PNG 다운로드</span>
                    </button>
                </div>
            </div>

            <!-- Diagram Canvas -->
            <div id="diagram" class="flex-1 bg-slate-900/90 border border-slate-700/70 rounded-xl p-6 flex items-center justify-center overflow-auto min-h-[460px]">
                <!-- Mermaid SVG Injected Here -->
            </div>

            <div class="pt-3 mt-3 border-t border-slate-700/60 text-right">
                <span class="text-[11px] text-slate-500">우클릭으로도 이미지를 바로 복사할 수 있습니다.</span>
            </div>
        </div>

    </main>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                background: '#0f172a',
                primaryColor: '#1e293b',
                primaryTextColor: '#f8fafc',
                primaryBorderColor: '#6366f1',
                lineColor: '#94a3b8',
                secondaryColor: '#334155',
                tertiaryColor: '#0f172a'
            },
            securityLevel: 'loose'
        });

        let blocks = [
            { id: 1, type: 'step', text: '사용자 접속', next: '' },
            { id: 2, type: 'branch', text: '로그인 확인?', yesText: '메인 대시보드', noText: '회원가입 진행' },
            { id: 3, type: 'step', text: '회원가입 진행', next: '메인 대시보드' },
            { id: 4, type: 'step', text: '메인 대시보드', next: '' },
            { id: 5, type: 'step', text: '서비스 이용 완료', next: '' }
        ];
        let nextId = 6;

        const blockListEl = document.getElementById('blockList');
        const diagramArea = document.getElementById('diagram');

        function renderBlocksUI() {
            blockListEl.innerHTML = '';
            blocks.forEach((b, idx) => {
                const card = document.createElement('div');
                const isStep = b.type === 'step';
                card.className = `p-4 rounded-xl border ${isStep ? 'bg-slate-900/70 border-indigo-900/60 border-l-4 border-l-indigo-500' : 'bg-slate-900/70 border-amber-900/60 border-l-4 border-l-amber-500'} space-y-3`;

                if (isStep) {
                    card.innerHTML = `
                        <div class="flex items-center justify-between text-xs font-bold text-indigo-400">
                            <span>🟦 단계 (Square)</span>
                            <button onclick="removeBlock(${idx})" class="text-slate-500 hover:text-rose-400 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 mb-1">단계 이름</label>
                            <input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500" placeholder="예: 사용자 접속" value="${b.text}" oninput="updateBlock(${idx}, 'text', this.value)" aria-label="Input field">
                        </div>
                        <div class="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/60">
                            <label class="block text-[10px] text-slate-400 mb-1">⬇️ 다음 연결 (비워두면 아래 단계 자동 연결)</label>
                            <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-indigo-500" placeholder="특정 단계로 점프 시 이름 입력" value="${b.next || ''}" oninput="updateBlock(${idx}, 'next', this.value)" aria-label="Input field">
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex items-center justify-between text-xs font-bold text-amber-400">
                            <span>🔶 조건 분기 (Diamond)</span>
                            <button onclick="removeBlock(${idx})" class="text-slate-500 hover:text-rose-400 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 mb-1">조건 질문</label>
                            <input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-amber-500" placeholder="예: 로그인 확인?" value="${b.text}" oninput="updateBlock(${idx}, 'text', this.value)" aria-label="Input field">
                        </div>
                        <div class="grid grid-cols-2 gap-2 bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/60">
                            <div>
                                <label class="block text-[10px] text-emerald-400 font-bold mb-1">🟢 예 (Yes)</label>
                                <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-emerald-500" placeholder="이동할 단계명" value="${b.yesText || ''}" oninput="updateBlock(${idx}, 'yesText', this.value)" aria-label="Input field">
                            </div>
                            <div>
                                <label class="block text-[10px] text-rose-400 font-bold mb-1">🔴 아니오 (No)</label>
                                <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-rose-500" placeholder="이동할 단계명" value="${b.noText || ''}" oninput="updateBlock(${idx}, 'noText', this.value)" aria-label="Input field">
                            </div>
                        </div>
                    `;
                }
                blockListEl.appendChild(card);
            });

            renderDiagram();
        }

        function updateBlock(index, field, value) {
            blocks[index][field] = value;
            renderDiagram();
        }

        function addBlock(type) {
            if (type === 'step') {
                blocks.push({ id: nextId++, type: 'step', text: '', next: '' });
            } else {
                blocks.push({ id: nextId++, type: 'branch', text: '', yesText: '', noText: '' });
            }
            renderBlocksUI();
            blockListEl.scrollTop = blockListEl.scrollHeight;
        }

        function removeBlock(index) {
            blocks.splice(index, 1);
            renderBlocksUI();
        }

        function resetBlocks() {
            blocks = [{ id: 1, type: 'step', text: '사용자 접속', next: '' }];
            renderBlocksUI();
        }

        function generateMermaidCode() {
            let nodeMap = new Map();
            let nIdx = 1;
            let shapes = {};
            let edges = '';

            function getId(name) {
                if (!name) return null;
                let clean = name.trim();
                if (clean === '') return null;
                if (!nodeMap.has(clean)) {
                    nodeMap.set(clean, `N${nIdx++}`);
                }
                return nodeMap.get(clean);
            }

            blocks.forEach(b => {
                let id = getId(b.text);
                if (id) {
                    shapes[id] = b.type === 'branch' ? `{"${b.text.trim()}"}` : `["${b.text.trim()}"]`;
                }
            });

            blocks.forEach((b, i) => {
                let id = getId(b.text);
                if (!id) return;

                if (b.type === 'step') {
                    let targetName = b.next ? b.next.trim() : (i + 1 < blocks.length ? blocks[i+1].text.trim() : null);
                    if (targetName) {
                        let tid = getId(targetName);
                        if (!shapes[tid]) shapes[tid] = `["${targetName}"]`;
                        edges += `    ${id} --> ${tid}\n`;
                    }
                } else if (b.type === 'branch') {
                    if (b.yesText && b.yesText.trim() !== '') {
                        let tid = getId(b.yesText);
                        if (!shapes[tid]) shapes[tid] = `["${b.yesText.trim()}"]`;
                        edges += `    ${id} --예--> ${tid}\n`;
                    }
                    if (b.noText && b.noText.trim() !== '') {
                        let tid = getId(b.noText);
                        if (!shapes[tid]) shapes[tid] = `["${b.noText.trim()}"]`;
                        edges += `    ${id} --아니오--> ${tid}\n`;
                    }
                }
            });

            let nodeStr = Object.keys(shapes).map(id => `    ${id}${shapes[id]}`).join('\n');
            if (nodeStr === '') return 'graph TD\n    Empty["블록을 추가하고 이름을 입력해주세요!"]';

            return `graph TD\n${nodeStr}\n${edges}`;
        }

        async function renderDiagram() {
            const mermaidCode = generateMermaidCode();
            try {
                diagramArea.innerHTML = '';
                const id = 'mermaid-svg-' + Date.now();
                const { svg } = await mermaid.render(id, mermaidCode);
                diagramArea.innerHTML = svg;
            } catch (e) {
                // Ignore transient syntax updates
            }
        }

        function downloadSVG() {
            const svgElement = diagramArea.querySelector('svg');
            if (!svgElement) return;
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl = URL.createObjectURL(svgBlob);
            const a = document.createElement('a');
            a.href = svgUrl;
            a.download = `flowchart_${Date.now()}.svg`;
            a.click();
            URL.revokeObjectURL(svgUrl);
        }

        function downloadPNG() {
            const svgElement = diagramArea.querySelector('svg');
            if (!svgElement) {
                alert('다운로드할 다이어그램이 없습니다.');
                return;
            }

            // 1. SVG 복제 및 필수 네임스페이스/스타일 보정
            const clonedSvg = svgElement.cloneNode(true);
            clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clonedSvg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

            // 실제 크기 계산
            const bbox = svgElement.getBoundingClientRect();
            const width = Math.max(bbox.width, 800);
            const height = Math.max(bbox.height, 600);
            clonedSvg.setAttribute('width', width);
            clonedSvg.setAttribute('height', height);

            const svgString = new XMLSerializer().serializeToString(clonedSvg);
            const svgBase64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

            const image = new Image();
            image.onload = () => {
                const scale = 2; // 2배 고화질 Retina 해상도
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;

                const ctx = canvas.getContext('2d');
                // 다크 배경 채우기
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.scale(scale, scale);
                ctx.drawImage(image, 0, 0, width, height);

                // PNG 다운로드 트리거
                const pngUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = `flowchart_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            image.onerror = () => {
                alert('PNG 변환 중 오류가 발생했습니다. SVG 다운로드를 이용해 주세요.');
            };

            image.src = svgBase64;
        }

        window.addEventListener('DOMContentLoaded', renderBlocksUI);
    </script>
</body>
</html>
