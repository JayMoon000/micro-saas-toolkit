<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 한/영 글자수 및 단어수 분석기 - StarSign16 Toolkit</title>
    <meta name="description" content="공백 포함/제외 한글 글자수, 영문 단어수, 바이트(Byte), 원고지 매수를 0.1초 만에 정밀 측정합니다.">
    <meta name="keywords" content="글자수 세기, 자소서 글자수, 단어수 측정, 바이트 계산기, 원고지 분량 계산">
    <meta name="author" content="StarSign16">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tool.starsign16.com/ko/olld_tools/char_counter.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tool.starsign16.com/char_counter.html">
    <meta property="og:title" content="실시간 글자수 & 단어수 분석기 - StarSign16">
    <meta property="og:description" content="공백 포함/제외 글자수, 영문 단어수, 원고지 매수 실시간 분석.">
    <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">

    <!-- Favicon & Analytics -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/png" href="favicon.png">
    <script src="analytics.js" defer></script>
	
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 메인으로
                </a>
                <div class="w-8 h-8 bg-rose-950/80 text-rose-400 border border-rose-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">실시간 글자수 & 단어수 분석기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-rose-950/80 text-rose-400 border border-rose-800/60">
                100% 클라이언트 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Stat Cards Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">공백 포함</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-with-space" class="text-2xl font-black text-slate-50">0</span>
                    <span class="text-xs text-slate-500">자</span>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">공백 제외</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-no-space" class="text-2xl font-black text-rose-400">0</span>
                    <span class="text-xs text-slate-500">자</span>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">단어 수 (Word)</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-words" class="text-2xl font-black text-slate-50">0</span>
                    <span class="text-xs text-slate-500">개</span>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">원고지 (200자)</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-manuscript" class="text-2xl font-black text-amber-400">0</span>
                    <span class="text-xs text-slate-500">장</span>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">용량 (UTF-8)</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-bytes" class="text-2xl font-black text-slate-50">0</span>
                    <span class="text-xs text-slate-500">Byte</span>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">줄 / 문단</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="stat-lines" class="text-2xl font-black text-slate-50">0</span>
                    <span class="text-xs text-slate-500">줄</span>
                </div>
            </div>
        </div>

        <!-- Textarea Editor -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 shadow-2xl flex flex-col justify-between">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">텍스트 실시간 입력</span>
                <div class="flex items-center space-x-2">
                    <button id="copy-btn" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 transition flex items-center space-x-1.5">
                        <i class="fa-regular fa-clone"></i>
                        <span id="copy-text">텍스트 복사</span>
                    </button>
                    <button id="clear-btn" class="px-3 py-1.5 rounded-lg bg-rose-950/50 hover:bg-rose-900/60 border border-rose-800/50 text-xs font-semibold text-rose-300 transition">
                        비우기
                    </button>
                </div>
            </div>
            <textarea id="main-textarea" class="w-full h-[420px] p-4 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-sm text-slate-200 placeholder-slate-600 focus:border-rose-500 outline-none resize-none leading-relaxed transition" placeholder="분석할 글이나 원고를 입력하거나 붙여넣으세요..."></textarea>
        </div>

    </main>

    <script>
        const input = document.getElementById('main-textarea');
        const statWithSpace = document.getElementById('stat-with-space');
        const statNoSpace = document.getElementById('stat-no-space');
        const statWords = document.getElementById('stat-words');
        const statManuscript = document.getElementById('stat-manuscript');
        const statBytes = document.getElementById('stat-bytes');
        const statLines = document.getElementById('stat-lines');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const clearBtn = document.getElementById('clear-btn');

        function analyze() {
            const val = input.value;
            const withSpace = val.length;
            const noSpace = val.replace(/\s/g, '').length;
            const words = val.trim() ? val.trim().split(/\s+/).length : 0;
            const manuscript = Math.ceil(noSpace / 200);
            const bytes = new TextEncoder().encode(val).length;
            const lines = val ? val.split(/\r?\n/).length : 0;

            statWithSpace.innerText = withSpace.toLocaleString();
            statNoSpace.innerText = noSpace.toLocaleString();
            statWords.innerText = words.toLocaleString();
            statManuscript.innerText = manuscript.toLocaleString();
            statBytes.innerText = bytes.toLocaleString();
            statLines.innerText = lines.toLocaleString();
        }

        input.addEventListener('input', analyze);

        clearBtn.addEventListener('click', () => {
            input.value = '';
            analyze();
            input.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!input.value) return;
            await navigator.clipboard.writeText(input.value);
            copyText.innerText = '복사 완료!';
            setTimeout(() => { copyText.innerText = '텍스트 복사'; }, 1500);
        });
    </script>
</body>
</html>
