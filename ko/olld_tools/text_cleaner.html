<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고속 텍스트 리스트 중복 제거 & 정렬기 - StarSign16 Toolkit</title>
    <meta name="description" content="대량의 키워드, 이메일, 리스트 데이터의 중복을 0.1초 만에 제거하고 가나다/길이순으로 정렬합니다.">
    <meta name="keywords" content="텍스트 중복제거, 리스트 정렬, 키워드 정리, 줄바꿈 제거, 콤마 구분">
    <meta name="author" content="StarSign16">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tool.starsign16.com/ko/olld_tools/text_cleaner.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tool.starsign16.com/text_cleaner.html">
    <meta property="og:title" content="텍스트 중복 제거 & 정렬기 - StarSign16">
    <meta property="og:description" content="엑셀보다 빠른 대량 텍스트 중복 정리 및 정렬 도구.">
    <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">

    <!-- Favicon & Analytics -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/png" href="favicon.png">
    <script src="analytics.js" defer></script>
	
    <script src="https://cdn.tailwindcss.com"></script defer>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-violet-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 메인으로
                </a>
                <div class="w-8 h-8 bg-violet-950/80 text-violet-400 border border-violet-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-broom"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">텍스트 중복 제거 & 정렬기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-violet-950/80 text-violet-400 border border-violet-800/60">
                100% 클라이언트 연산
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Options Bar -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 shadow-sm">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 text-xs">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-trim" checked class="rounded bg-slate-900 border-slate-700 text-violet-500 focus:ring-violet-400 w-4 h-4">
                    <span class="text-slate-300 font-medium">앞뒤 공백 제거</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-case" class="rounded bg-slate-900 border-slate-700 text-violet-500 focus:ring-violet-400 w-4 h-4">
                    <span class="text-slate-300 font-medium">대소문자 무시</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-empty" checked class="rounded bg-slate-900 border-slate-700 text-violet-500 focus:ring-violet-400 w-4 h-4">
                    <span class="text-slate-300 font-medium">빈 줄 자동 제거</span>
                </label>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 font-medium">입력 구분:</span>
                    <select id="opt-delimiter" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 outline-none text-slate-200">
                        <option value="newline">줄바꿈(엔터)</option>
                        <option value="comma">쉼표(,)</option>
                        <option value="space">공백(스페이스)</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 font-medium">정렬:</span>
                    <select id="opt-sort" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 outline-none text-slate-200">
                        <option value="none">원래 순서</option>
                        <option value="asc">오름차순 (가나다/ABC)</option>
                        <option value="desc">내림차순 (하파타/ZYX)</option>
                        <option value="length">글자 길이순</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 font-medium">출력 구분:</span>
                    <select id="opt-output-delimiter" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 outline-none text-slate-200">
                        <option value="newline">줄바꿈</option>
                        <option value="comma">쉼표+공백 (, )</option>
                        <option value="comma-only">쉼표만 (,)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Textarea Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Input Box -->
            <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">원본 텍스트 입력</span>
                        <button id="clear-input-btn" class="text-xs text-slate-500 hover:text-slate-300 transition">비우기</button>
                    </div>
                    <textarea id="input-text" class="w-full h-80 p-3.5 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-xs text-slate-200 focus:border-violet-500 outline-none resize-none placeholder-slate-600 transition" placeholder="중복을 제거할 리스트를 여기에 붙여넣으세요..."></textarea>
                </div>
                <div class="pt-3 border-t border-slate-700/60 mt-3 text-xs text-slate-400 flex justify-between">
                    <span>입력 항목: <strong id="input-count" class="text-slate-200 font-semibold">0</strong>개</span>
                    <span>글자 수: <strong id="input-chars" class="text-slate-200 font-semibold">0</strong>자</span>
                </div>
            </div>

            <!-- Output Box -->
            <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">정리된 결과</span>
                            <span id="dedup-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-950 text-violet-400 border border-violet-800/60">중복 0개 제거됨</span>
                        </div>
                        <button id="copy-btn" class="text-xs font-bold text-violet-400 hover:text-violet-300 flex items-center space-x-1 transition">
                            <i class="fa-regular fa-clone"></i>
                            <span id="copy-text">결과 복사</span>
                        </button>
                    </div>
                    <textarea id="output-text" readonly class="w-full h-80 p-3.5 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-xs text-slate-200 outline-none resize-none placeholder-slate-600" placeholder="실시간으로 정리된 결과가 여기에 표시됩니다."></textarea>
                </div>
                <div class="pt-3 border-t border-slate-700/60 mt-3 text-xs text-slate-400 flex justify-between">
                    <span>최종 항목: <strong id="output-count" class="text-violet-400 font-bold">0</strong>개</span>
                    <span>글자 수: <strong id="output-chars" class="text-slate-200 font-semibold">0</strong>자</span>
                </div>
            </div>

        </div>

    </main>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const optTrim = document.getElementById('opt-trim');
        const optCase = document.getElementById('opt-case');
        const optEmpty = document.getElementById('opt-empty');
        const optDelimiter = document.getElementById('opt-delimiter');
        const optSort = document.getElementById('opt-sort');
        const optOutputDelimiter = document.getElementById('opt-output-delimiter');
        const inputCount = document.getElementById('input-count');
        const inputChars = document.getElementById('input-chars');
        const outputCount = document.getElementById('output-count');
        const outputChars = document.getElementById('output-chars');
        const dedupBadge = document.getElementById('dedup-badge');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const clearInputBtn = document.getElementById('clear-input-btn');

        function processText() {
            const raw = inputText.value;
            inputChars.innerText = raw.length.toLocaleString();

            if (!raw) {
                outputText.value = '';
                inputCount.innerText = '0';
                outputCount.innerText = '0';
                outputChars.innerText = '0';
                dedupBadge.innerText = '중복 0개 제거됨';
                return;
            }

            let items = [];
            if (optDelimiter.value === 'newline') items = raw.split(/\r?\n/);
            else if (optDelimiter.value === 'comma') items = raw.split(',');
            else if (optDelimiter.value === 'space') items = raw.split(/\s+/);

            inputCount.innerText = items.length.toLocaleString();

            if (optTrim.checked) items = items.map(s => s.trim());
            if (optEmpty.checked) items = items.filter(s => s.length > 0);

            const seen = new Set();
            const unique = [];

            for (const item of items) {
                const checkKey = optCase.checked ? item.toLowerCase() : item;
                if (!seen.has(checkKey)) {
                    seen.add(checkKey);
                    unique.push(item);
                }
            }

            const removedCount = items.length - unique.length;
            dedupBadge.innerText = `중복 ${removedCount.toLocaleString()}개 제거됨`;

            if (optSort.value === 'asc') unique.sort((a, b) => a.localeCompare(b, 'ko'));
            else if (optSort.value === 'desc') unique.sort((a, b) => b.localeCompare(a, 'ko'));
            else if (optSort.value === 'length') unique.sort((a, b) => a.length - b.length || a.localeCompare(b, 'ko'));

            let outSep = '\n';
            if (optOutputDelimiter.value === 'comma') outSep = ', ';
            else if (optOutputDelimiter.value === 'comma-only') outSep = ',';

            const resultStr = unique.join(outSep);
            outputText.value = resultStr;
            outputCount.innerText = unique.length.toLocaleString();
            outputChars.innerText = resultStr.length.toLocaleString();
        }

        [inputText, optTrim, optCase, optEmpty, optDelimiter, optSort, optOutputDelimiter].forEach(el => {
            el.addEventListener('input', processText);
            el.addEventListener('change', processText);
        });

        clearInputBtn.addEventListener('click', () => {
            inputText.value = '';
            processText();
            inputText.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!outputText.value) return;
            await navigator.clipboard.writeText(outputText.value);
            copyText.innerText = '복사 완료!';
            setTimeout(() => { copyText.innerText = '결과 복사'; }, 1500);
        });
    </script>
</body>
</html>
