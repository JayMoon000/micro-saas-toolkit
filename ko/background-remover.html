<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 배경 제거 (누끼 따기) - StarSign16 툴킷</title>
  <meta name="description" content="브라우저 내장 AI 엔진으로 인물과 사물 배경을 100% 무료로 분리합니다. 서버 전송 없음.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="../background-remover.html" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">이미지 & 미디어</span>
      </div>
      <h1 class="text-2xl font-bold text-white">AI 배경 제거 (누끼 따기)</h1>
      <p class="text-xs text-slate-400">고정밀 범용 AI 모델 기반 온디바이스 배경 분리. 내 컴퓨터 메모리에서 직접 연산됩니다.</p>
    </div>

    <div
      id="dropZone"
      onclick="document.getElementById('fileInput').click()"
      class="border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-slate-950/60 rounded-xl p-8 text-center cursor-pointer transition mb-6"
    >
      <input type="file" id="fileInput" accept="image/*" class="hidden" />
      <div class="text-3xl mb-2">✂️</div>
      <p class="text-sm font-semibold text-slate-200 mb-1">배경을 제거할 사진을 클릭하거나 드래그하세요</p>
      <p class="text-xs text-slate-500">인물 전신, 사물, 동물 지원 (서버 업로드 $0)</p>
    </div>

    <div id="loadingState" class="hidden bg-slate-950 border border-slate-800 p-8 rounded-xl text-center mb-6">
      <div class="inline-block animate-spin text-2xl mb-3">⚙️</div>
      <p class="text-sm font-semibold text-cyan-400 mb-1" id="loadingText">AI 모델 초기화 중...</p>
      <p class="text-xs text-slate-500">첫 실행 시 브라우저 메모리에 AI 모델을 캐싱합니다.</p>
    </div>

    <div id="workspace" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center">
          <span class="text-xs font-semibold text-slate-400 mb-3 self-start">원본 사진</span>
          <div class="w-full h-64 flex items-center justify-center bg-slate-900/50 rounded-lg overflow-hidden p-2">
            <img id="origImg" class="max-h-full max-w-full object-contain rounded" alt="원본" />
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center">
          <span class="text-xs font-semibold text-cyan-400 mb-3 self-start">배경 제거 결과 (투명 PNG)</span>
          <div class="w-full h-64 flex items-center justify-center checkerboard rounded-lg overflow-hidden p-2">
            <img id="resultImg" class="max-h-full max-w-full object-contain" alt="누끼 결과" />
          </div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="resetWorkspace()" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition">
          다른 사진 작업하기
        </button>
        <a id="downloadBtn" download="starsign16-cutout.png" class="px-8 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold text-center transition">
          투명 PNG 다운로드
        </a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script type="module">
    import { AutoModel, AutoProcessor, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    
    env.allowLocalModels = false;
    env.backends.onnx.wasm.numThreads = 1;

    let model = null;
    let processor = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const loadingState = document.getElementById('loadingState');
    const loadingText = document.getElementById('loadingText');
    const workspace = document.getElementById('workspace');
    const origImg = document.getElementById('origImg');
    const resultImg = document.getElementById('resultImg');
    const downloadBtn = document.getElementById('downloadBtn');

    window.resetWorkspace = function() {
      fileInput.value = '';
      workspace.classList.add('hidden');
      loadingState.classList.add('hidden');
      dropZone.classList.remove('hidden');
    };

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-cyan-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-500');
      if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) processFile(e.target.files[0]);
    });

    async function processFile(file) {
      if (!file.type.startsWith('image/')) return alert('유효한 이미지 파일을 업로드해 주세요.');

      const imgUrl = URL.createObjectURL(file);
      origImg.src = imgUrl;
      dropZone.classList.add('hidden');
      workspace.classList.add('hidden');
      loadingState.classList.remove('hidden');

      try {
        if (!model || !processor) {
          loadingText.innerText = 'RMBG 고정밀 AI 모델 로딩 중...';
          const model_id = 'briaai/RMBG-1.4';
          model = await AutoModel.from_pretrained(model_id, { quantized: true });
          processor = await AutoProcessor.from_pretrained(model_id);
        }

        loadingText.innerText = '배경 및 피사체 분리 추출 중...';

        const image = await RawImage.fromURL(imgUrl);
        const { pixel_values } = await processor(image);

        const { output } = await model({ input: pixel_values });
        const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(image.width, image.height);

        const canvas = document.createElement('canvas');
        canvas.width = image.width;
        canvas.height = image.height;
        const ctx = canvas.getContext('2d');

        const rawCanvas = image.toCanvas();
        ctx.drawImage(rawCanvas, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const maskData = mask.data;

        for (let i = 0; i < maskData.length; i++) {
          imgData.data[4 * i + 3] = maskData[i];
        }
        ctx.putImageData(imgData, 0, 0);

        const outUrl = canvas.toDataURL('image/png');
        resultImg.src = outUrl;
        downloadBtn.href = outUrl;

        loadingState.classList.add('hidden');
        workspace.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert('이미지 처리에 실패했습니다. 일반 PNG/JPG 파일로 다시 시도해 주세요.');
        window.resetWorkspace();
      }
    }
  </script>
</body>
</html>
