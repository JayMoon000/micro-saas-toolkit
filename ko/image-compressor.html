<html lang="ko">
<head>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

  <meta property="og:type" content="website">
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">

  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/image-compressor" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">이미지 & 미디어</span>
      </div>
      <h1 class="text-2xl font-bold text-white">이미지 용량 압축기</h1>
      <p class="text-xs text-slate-400">HTML5 Canvas 기반 로컬 처리로 원본 화질을 유지하며 파일 크기를 대폭 줄입니다.</p>
    </div>

    <!-- Drop Zone -->
    <div
      id="dropZone"
      onclick="document.getElementById('fileInput').click()"
      class="border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-slate-950/60 rounded-xl p-8 text-center cursor-pointer transition mb-6"
    >
      <input type="file" id="fileInput" accept="image/*" class="hidden" />
      <div class="text-3xl mb-2">📥</div>
      <p class="text-sm font-semibold text-slate-200 mb-1">압축할 이미지를 클릭하거나 드래그 & 드롭하세요</p>
      <p class="text-xs text-slate-500">PNG, JPG, WebP 지원 (서버 업로드 없음)</p>
    </div>

    <!-- Workspace -->
    <div id="workspace" class="hidden space-y-6">
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4 flex-1 min-w-[240px]">
          <span class="text-xs font-semibold text-slate-400">압축 화질: <strong id="qualityVal" class="text-cyan-400 font-mono">80%</strong></span>
          <input type="range" id="qualityRange" min="10" max="100" value="80" class="flex-1 accent-cyan-500 cursor-pointer" />
        </div>
        <div class="flex items-center gap-3 text-xs">
          <span class="text-slate-500">저장 포맷:</span>
          <select id="formatSelect" class="bg-slate-900 border border-slate-800 text-slate-300 p-1.5 rounded focus:outline-none font-mono">
            <option value="image/jpeg">JPG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center">
          <div class="flex justify-between w-full text-xs text-slate-400 mb-3">
            <span>원본 이미지</span>
            <span id="origSize" class="font-mono text-slate-200">0 KB</span>
          </div>
          <div class="w-full h-64 flex items-center justify-center bg-slate-900/50 rounded-lg overflow-hidden p-2">
            <img id="origPreview" class="max-h-full max-w-full object-contain rounded" alt="원본" />
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center">
          <div class="flex justify-between w-full text-xs text-slate-400 mb-3">
            <span class="text-cyan-400 font-semibold">압축 결과 (<span id="savedPct" class="text-emerald-400">-0%</span>)</span>
            <span id="compSize" class="font-mono text-cyan-400 font-bold">0 KB</span>
          </div>
          <div class="w-full h-64 flex items-center justify-center bg-slate-900/50 rounded-lg overflow-hidden p-2">
            <img id="compPreview" class="max-h-full max-w-full object-contain rounded" alt="압축본" />
          </div>
        </div>
      </div>

      <div class="flex justify-center">
        <a id="downloadBtn" download="compressed-image.jpg" class="px-8 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold text-center transition cursor-pointer">
          압축된 이미지 다운로드
        </a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    let currentRawImage = null;
    let originalFileSize = 0;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const workspace = document.getElementById('workspace');
    const qualityRange = document.getElementById('qualityRange');
    const qualityVal = document.getElementById('qualityVal');
    const formatSelect = document.getElementById('formatSelect');
    const origPreview = document.getElementById('origPreview');
    const compPreview = document.getElementById('compPreview');
    const origSize = document.getElementById('origSize');
    const compSize = document.getElementById('compSize');
    const savedPct = document.getElementById('savedPct');
    const downloadBtn = document.getElementById('downloadBtn');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-cyan-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return alert('이미지 파일을 업로드해 주세요.');
      originalFileSize = file.size;
      origSize.innerText = `${(file.size / 1024).toFixed(1)} KB`;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentRawImage = img;
          origPreview.src = e.target.result;
          workspace.classList.remove('hidden');
          compressImage();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function compressImage() {
      if (!currentRawImage) return;

      const quality = parseInt(qualityRange.value) / 100;
      const format = formatSelect.value;
      qualityVal.innerText = `${qualityRange.value}%`;

      const canvas = document.createElement('canvas');
      canvas.width = currentRawImage.width;
      canvas.height = currentRawImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentRawImage, 0, 0);

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        compPreview.src = url;
        downloadBtn.href = url;
        downloadBtn.download = `compressed.${format === 'image/webp' ? 'webp' : 'jpg'}`;

        const cSize = blob.size;
        compSize.innerText = `${(cSize / 1024).toFixed(1)} KB`;

        const saved = Math.max(0, ((originalFileSize - cSize) / originalFileSize) * 100);
        savedPct.innerText = `-${saved.toFixed(1)}%`;
      }, format, quality);
    }

    qualityRange.addEventListener('input', compressImage);
    formatSelect.addEventListener('change', compressImage);
  </script>
</body>
</html>
