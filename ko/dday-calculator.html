<html lang="ko">

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition flex items-center gap-1">
        <span>←</span> <span>StarSign16 툴킷 허브</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/dday-calculator" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">생활 & 비즈니스</span>
      </div>
      <h1 class="text-2xl font-bold text-white">D-Day & 영업일(주말제외) 계산기</h1>
      <p class="text-xs text-slate-400">프로젝트 마감일, 시험 디데이 및 주말을 뺀 실제 업무 소요일수를 계산합니다.</p>
    </div>

    <div class="flex gap-2 mb-6 border-b border-slate-800 pb-px">
      <button onclick="switchTab('dday')" id="tabDdayBtn" class="px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition">
        디데이 (D-Day) 계산
      </button>
      <button onclick="switchTab('business')" id="tabBusinessBtn" class="px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
        영업일 (주말 제외) 계산
      </button>
    </div>

    <!-- 1. D-Day Workspace -->
    <div id="ddayWorkspace" class="space-y-6">
      <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">기준일 (시작일)</label>
          <input type="date" id="ddayBaseDate" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">목표일 (디데이 날짜)</label>
          <input type="date" id="ddayTargetDate" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" />
        </div>
      </div>

      <div class="bg-slate-950 border border-slate-800 p-8 rounded-xl text-center flex flex-col items-center justify-center">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">디데이 계산 결과</span>
        <div id="ddayBadge" class="text-4xl sm:text-5xl font-extrabold font-mono text-cyan-400 mb-3">D-0</div>
        <p id="ddayDesc" class="text-xs text-slate-400 max-w-sm">날짜를 지정하면 남은 일수와 주/개월 환산치가 표시됩니다.</p>
      </div>
    </div>

    <!-- 2. Business Days Workspace -->
    <div id="businessWorkspace" class="hidden space-y-6">
      <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">시작일</label>
            <input type="date" id="bizStartDate" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">종료일</label>
            <input type="date" id="bizEndDate" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" />
          </div>
        </div>

        <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
            <input type="checkbox" id="includeEndDate" checked class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0" />
            <span>종료일 포함 계산 (+1일)</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl text-center">
          <span class="text-xs text-slate-500 block mb-1">순수 영업일 (Working Days)</span>
          <span id="workingDaysCount" class="text-3xl font-bold font-mono text-cyan-400">0</span>
          <span class="text-[10px] text-slate-500 block mt-1">(월~금 근무일 기준)</span>
        </div>
        <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl text-center">
          <span class="text-xs text-slate-500 block mb-1">주말 일수 (Weekend)</span>
          <span id="weekendDaysCount" class="text-3xl font-bold font-mono text-indigo-400">0</span>
          <span class="text-[10px] text-slate-500 block mt-1">(토요일/일요일 합계)</span>
        </div>
        <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl text-center">
          <span class="text-xs text-slate-500 block mb-1">총 경과 일수</span>
          <span id="totalDaysCount" class="text-3xl font-bold font-mono text-slate-200">0</span>
          <span class="text-[10px] text-slate-500 block mt-1">(전체 달력 일수)</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const tabDdayBtn = document.getElementById('tabDdayBtn');
    const tabBusinessBtn = document.getElementById('tabBusinessBtn');
    const ddayWorkspace = document.getElementById('ddayWorkspace');
    const businessWorkspace = document.getElementById('businessWorkspace');

    function switchTab(mode) {
      if (mode === 'dday') {
        tabDdayBtn.className = 'px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition';
        tabBusinessBtn.className = 'px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        ddayWorkspace.classList.remove('hidden');
        businessWorkspace.classList.add('hidden');
      } else {
        tabBusinessBtn.className = 'px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition';
        tabDdayBtn.className = 'px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        businessWorkspace.classList.remove('hidden');
        ddayWorkspace.classList.add('hidden');
      }
    }

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('ddayBaseDate').value = today;
    document.getElementById('bizStartDate').value = today;

    const ddayBaseDate = document.getElementById('ddayBaseDate');
    const ddayTargetDate = document.getElementById('ddayTargetDate');
    const ddayBadge = document.getElementById('ddayBadge');
    const ddayDesc = document.getElementById('ddayDesc');

    function calculateDday() {
      if (!ddayBaseDate.value || !ddayTargetDate.value) return;

      const base = new Date(ddayBaseDate.value);
      const target = new Date(ddayTargetDate.value);
      const diffTime = target.getTime() - base.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) {
        ddayBadge.innerText = 'D-DAY';
        ddayBadge.className = 'text-4xl sm:text-5xl font-extrabold font-mono text-emerald-400 mb-3';
        ddayDesc.innerText = "오늘이 바로 목표일입니다!";
      } else if (diffDays > 0) {
        ddayBadge.innerText = `D-${diffDays}`;
        ddayBadge.className = 'text-4xl sm:text-5xl font-extrabold font-mono text-cyan-400 mb-3';
        ddayDesc.innerText = `${diffDays}일 남았습니다 (약 ${(diffDays / 7).toFixed(1)}주 / ${(diffDays / 30.4).toFixed(1)}개월).`;
      } else {
        ddayBadge.innerText = `D+${Math.abs(diffDays)}`;
        ddayBadge.className = 'text-4xl sm:text-5xl font-extrabold font-mono text-rose-400 mb-3';
        ddayDesc.innerText = `목표일로부터 ${Math.abs(diffDays)}일이 지났습니다.`;
      }
    }

    ddayBaseDate.addEventListener('change', calculateDday);
    ddayTargetDate.addEventListener('change', calculateDday);

    const nextMonth = new Date();
    nextMonth.setDate(nextMonth.getDate() + 14);
    ddayTargetDate.value = nextMonth.toISOString().split('T')[0];
    calculateDday();

    const bizStartDate = document.getElementById('bizStartDate');
    const bizEndDate = document.getElementById('bizEndDate');
    const includeEndDate = document.getElementById('includeEndDate');
    const workingDaysCount = document.getElementById('workingDaysCount');
    const weekendDaysCount = document.getElementById('weekendDaysCount');
    const totalDaysCount = document.getElementById('totalDaysCount');

    function calculateBusinessDays() {
      if (!bizStartDate.value || !bizEndDate.value) return;

      let start = new Date(bizStartDate.value);
      let end = new Date(bizEndDate.value);

      if (start > end) {
        workingDaysCount.innerText = '0';
        weekendDaysCount.innerText = '0';
        totalDaysCount.innerText = '날짜 범위 오류';
        return;
      }

      let working = 0;
      let weekend = 0;
      let cur = new Date(start);

      while (cur < end || (includeEndDate.checked && cur.getTime() === end.getTime())) {
        const dayOfWeek = cur.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
          weekend++;
        } else {
          working++;
        }
        cur.setDate(cur.getDate() + 1);
      }

      workingDaysCount.innerText = working;
      weekendDaysCount.innerText = weekend;
      totalDaysCount.innerText = working + weekend;
    }

    bizStartDate.addEventListener('change', calculateBusinessDays);
    bizEndDate.addEventListener('change', calculateBusinessDays);
    includeEndDate.addEventListener('change', calculateBusinessDays);

    const twoWeeks = new Date();
    twoWeeks.setDate(twoWeeks.getDate() + 14);
    bizEndDate.value = twoWeeks.toISOString().split('T')[0];
    calculateBusinessDays();
  </script>
</body>
</html>
