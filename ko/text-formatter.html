<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarSign16 툴킷 - 100% 무료 브라우저 도구</title>
  <meta name="description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <link rel="canonical" href="https://tool.starsign16.com/ko/text-formatter">
  
  <meta property="og:title" content="StarSign16 툴킷 - 100% 무료 브라우저 도구">
  <meta property="og:description" content="서버 전송 없는 안전한 16종 초경량 웹 유틸리티. 개발·업무 무료 도구 모음.">
  <meta property="og:url" content="https://tool.starsign16.com/ko/text-formatter">
  <meta property="og:image" content="https://tool.starsign16.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/text-formatter" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">텍스트 & 콘텐츠</span>
      </div>
      <h1 class="text-2xl font-bold text-white">텍스트 포매터 & 변환기</h1>
      <p class="text-xs text-slate-400">복사한 글의 깨진 줄바꿈 정리, 공백 제거, URL 슬러그 변환을 지원합니다.</p>
    </div>

    <!-- Actions Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
      <button onclick="formatCase('no-breaks')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-cyan-400 transition">줄바꿈(엔터) 제거</button>
      <button onclick="formatCase('trim')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">다중 공백 ➔ 1칸</button>
      <button onclick="formatCase('upper')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">대문자로 (UPPER)</button>
      <button onclick="formatCase('lower')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">소문자로 (lower)</button>
      <button onclick="formatCase('title')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">단어 첫글자 대문자</button>
      <button onclick="formatCase('slug')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">URL 슬러그화</button>
      <button onclick="formatCase('snake')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">snake_case</button>
      <button onclick="formatCase('camel')" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-semibold text-slate-200 transition">camelCase</button>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50 text-xs">
        <span id="charCount" class="text-slate-400">0 글자</span>
        <div class="flex gap-2">
          <button onclick="undo()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">되돌리기 (Undo)</button>
          <button onclick="clearText()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">비우기</button>
          <button onclick="copyText()" id="copyBtn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">복사</button>
        </div>
      </div>
      <textarea id="textInput" placeholder="정리할 텍스트를 입력하세요..." class="w-full h-80 p-4 bg-transparent text-sm text-slate-200 focus:outline-none resize-y leading-relaxed font-mono"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const copyBtn = document.getElementById('copyBtn');
    let history = [];

    function saveState() {
      if (history.length === 0 || history[history.length - 1] !== textInput.value) {
        history.push(textInput.value);
        if (history.length > 20) history.shift();
      }
    }

    function formatCase(type) {
      if (!textInput.value) return;
      saveState();
      let text = textInput.value;

      switch(type) {
        case 'upper': text = text.toUpperCase(); break;
        case 'lower': text = text.toLowerCase(); break;
        case 'title': text = text.replace(/\b\w/g, l => l.toUpperCase()); break;
        case 'slug':
          text = text.toLowerCase().trim()
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .replace(/^-+|-+$/g, '');
          break;
        case 'trim': text = text.replace(/[ \t]+/g, ' ').trim(); break;
        case 'no-breaks': text = text.replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim(); break;
        case 'snake':
          text = text.trim().toLowerCase().replace(/\s+/g, '_');
          break;
        case 'camel':
          text = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
          break;
      }
      textInput.value = text;
      updateStats();
    }

    function undo() {
      if (history.length > 0) {
        textInput.value = history.pop();
        updateStats();
      }
    }

    function updateStats() {
      charCount.innerText = `${textInput.value.length} 글자`;
    }

    function clearText() {
      saveState();
      textInput.value = '';
      updateStats();
      textInput.focus();
    }

    function copyText() {
      if (!textInput.value) return;
      navigator.clipboard.writeText(textInput.value);
      copyBtn.innerText = '복사완료!';
      setTimeout(() => copyBtn.innerText = '복사', 1500);
    }

    textInput.addEventListener('input', updateStats);
  </script>
</body>
</html>
