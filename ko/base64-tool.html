    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%),

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 툴킷 허브</a>
      <div class="flex items-center gap-3">
        <a href="/base64-tool" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">English</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">개발 & 데이터</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Base64 인코더 / 디코더</h1>
      <p class="text-xs text-slate-400">문자열과 이미지 파일을 Base64 코드로 변환하거나, Base64 코드를 원래 텍스트/이미지로 복원합니다.</p>
    </div>

    <div class="flex gap-2 mb-6 border-b border-slate-800 pb-px">
      <button onclick="switchTab('text')" id="tabTextBtn" class="px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition">텍스트 & 이미지 디코딩</button>
      <button onclick="switchTab('file')" id="tabFileBtn" class="px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">파일 / 이미지 ➔ Base64</button>
    </div>

    <div id="textMode" class="block space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
          <div class="px-4 py-2 bg-slate-900/80 border-b border-slate-800 text-xs font-semibold text-slate-400 flex justify-between">
            <span>입력값 (일반 텍스트 또는 Base64 코드)</span>
          </div>
          <textarea id="textInput" placeholder="일반 텍스트나 Base64 코드(data:image/png;base64,... 등)를 붙여넣으세요" class="w-full p-4 bg-transparent text-sm text-slate-200 focus:outline-none font-mono leading-relaxed resize-y h-64"></textarea>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
          <div class="px-4 py-2 bg-slate-900/80 border-b border-slate-800 text-xs font-semibold text-cyan-400 flex justify-between items-center">
            <span>변환 결과</span>
            <span id="outputTypeTag" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded hidden">이미지 감지됨</span>
          </div>
          <textarea id="textOutput" readonly placeholder="변환 결과가 여기에 표시됩니다..." class="w-full p-4 bg-transparent text-sm text-cyan-300 focus:outline-none font-mono leading-relaxed resize-y h-64"></textarea>
          <div id="imgPreviewContainer" class="hidden flex-1 p-4 checkerboard flex flex-col items-center justify-center min-h-[256px]">
            <img id="decodedImagePreview" class="max-h-48 object-contain rounded mb-3 shadow" alt="복원된 이미지" />
            <a id="downloadDecodedImgBtn" download="decoded-image.png" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-bold transition">복원된 이미지 다운로드</a>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-950 border border-slate-800 p-3 rounded-lg text-xs">
        <div class="flex gap-2">
          <button onclick="processText('encode')" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold transition">인코딩 (텍스트 ➔ Base64)</button>
          <button onclick="processText('decode')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold transition">디코딩 (Base64 ➔ 텍스트/이미지)</button>
        </div>
        <div class="flex gap-2">
          <button onclick="clearText()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium transition">지우기</button>
          <button onclick="copyTextOutput()" id="copyTextBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition border border-slate-600">결과 복사</button>
        </div>
      </div>
    </div>

    <div id="fileMode" class="hidden space-y-6">
      <div
        id="dropZone"
        onclick="document.getElementById('fileInput').click()"
        class="border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-slate-950/60 rounded-xl p-8 text-center cursor-pointer transition"
      >
        <input type="file" id="fileInput" class="hidden" />
        <div class="text-3xl mb-2">📄</div>
        <p class="text-sm font-semibold text-slate-200 mb-1">파일을 클릭하거나 드래그하여 업로드하세요</p>
        <p class="text-xs text-slate-500">이미지, PDF, 폰트 파일 지원 (전체 Data URL 생성)</p>
      </div>

      <div id="fileResultArea" class="hidden bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
        <div class="px-4 py-2 bg-slate-900/80 border-b border-slate-800 text-xs font-semibold text-cyan-400 flex justify-between items-center">
          <span>Base64 코드 문자열</span>
          <span id="fileSizeStat" class="text-[10px] text-slate-500 font-mono"></span>
        </div>
        <textarea id="fileOutput" readonly class="w-full p-4 bg-transparent text-xs text-cyan-300 focus:outline-none font-mono leading-relaxed resize-y h-48 break-all"></textarea>
        <div class="p-3 bg-slate-900/50 border-t border-slate-800 flex justify-between items-center">
          <span class="text-xs text-slate-400" id="fileNameDisp">파일명</span>
          <button onclick="copyFileOutput()" id="copyFileBtn" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-bold transition">Base64 복사</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>StarSign16 생태계. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">메인 허브</a></p>
  </footer>

  <script>
    const tabTextBtn = document.getElementById('tabTextBtn');
    const tabFileBtn = document.getElementById('tabFileBtn');
    const textMode = document.getElementById('textMode');
    const fileMode = document.getElementById('fileMode');

    function switchTab(mode) {
      if (mode === 'text') {
        tabTextBtn.className = 'px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition';
        tabFileBtn.className = 'px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        textMode.classList.replace('hidden', 'block');
        fileMode.classList.add('hidden');
      } else {
        tabFileBtn.className = 'px-5 py-2.5 text-sm font-bold border-b-2 border-cyan-500 text-cyan-400 transition';
        tabTextBtn.className = 'px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        fileMode.classList.replace('hidden', 'block');
        textMode.classList.add('hidden');
        textMode.classList.remove('block');
      }
    }

    const textInput = document.getElementById('textInput');
    const textOutput = document.getElementById('textOutput');
    const imgPreviewContainer = document.getElementById('imgPreviewContainer');
    const decodedImagePreview = document.getElementById('decodedImagePreview');
    const downloadDecodedImgBtn = document.getElementById('downloadDecodedImgBtn');
    const outputTypeTag = document.getElementById('outputTypeTag');

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
    function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

    function processText(action) {
      let val = textInput.value.trim();
      if (!val) return;

      if (action === 'encode') {
        imgPreviewContainer.classList.add('hidden');
        textOutput.classList.remove('hidden');
        outputTypeTag.classList.add('hidden');
        textOutput.value = utf8_to_b64(val);
      } else {
        if (val.startsWith('data:image/') || (/^[A-Za-z0-9+/=]+$/.test(val.replace(/\s/g, '')) && val.length > 500)) {
          const dataUri = val.startsWith('data:image/') ? val : `data:image/png;base64,${val}`;
          decodedImagePreview.src = dataUri;
          downloadDecodedImgBtn.href = dataUri;
          textOutput.classList.add('hidden');
          imgPreviewContainer.classList.remove('hidden');
          outputTypeTag.classList.remove('hidden');
        } else {
          try {
            imgPreviewContainer.classList.add('hidden');
            textOutput.classList.remove('hidden');
            outputTypeTag.classList.add('hidden');
            textOutput.value = b64_to_utf8(val);
          } catch (err) {
            alert("올바르지 않은 Base64 문자열입니다.");
          }
        }
      }
    }

    function clearText() {
      textInput.value = '';
      textOutput.value = '';
      imgPreviewContainer.classList.add('hidden');
      textOutput.classList.remove('hidden');
      outputTypeTag.classList.add('hidden');
      textInput.focus();
    }

    function copyTextOutput() {
      if (textOutput.classList.contains('hidden') || !textOutput.value) return;
      navigator.clipboard.writeText(textOutput.value);
      const btn = document.getElementById('copyTextBtn');
      btn.innerText = '복사완료!';
      setTimeout(() => btn.innerText = '결과 복사', 1500);
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileResultArea = document.getElementById('fileResultArea');
    const fileOutput = document.getElementById('fileOutput');
    const fileSizeStat = document.getElementById('fileSizeStat');
    const fileNameDisp = document.getElementById('fileNameDisp');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-cyan-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        fileResultArea.classList.remove('hidden');
        fileOutput.value = e.target.result;
        fileNameDisp.innerText = file.name;
        const kb = (e.target.result.length / 1024).toFixed(2);
        fileSizeStat.innerText = `문자열 크기: ${kb} KB`;
      };
      reader.readAsDataURL(file);
    }

    function copyFileOutput() {
      if (!fileOutput.value) return;
      navigator.clipboard.writeText(fileOutput.value);
      const btn = document.getElementById('copyFileBtn');
      btn.innerText = '복사완료!';
      setTimeout(() => btn.innerText = 'Base64 복사', 1500);
    }
  </script>
</body>
</html>
