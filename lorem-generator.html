<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Analytics: GA4 & Cloudflare -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6LFL2P1WRN"></script>

    gtag('config', 'G-6LFL2P1WRN');

  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6d000ebb184d437c8af3ee42a914a19d"}'></script>
  <!-- End Analytics -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum & Dummy Text Generator - StarSign16 Toolkit</title>
  <meta name="description" content="Generate customizable placeholder dummy text in English and Korean instantly. 100% client-side.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 Toolkit Hub</a>
      <div class="flex items-center gap-3">
        <a href="/ko/lorem-generator" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">Korean</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Text & Content</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Lorem Ipsum Generator</h1>
      <p class="text-xs text-slate-400">Generate clean dummy filler text by paragraphs, sentences, or words.</p>
    </div>

    <!-- Controls -->
    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl mb-4 grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
      <div>
        <label class="text-slate-400 block mb-1">Language</label>
        <select id="langSelect" class="w-full p-2 bg-slate-900 border border-slate-800 rounded text-slate-200 focus:outline-none">
          <option value="latin">Latin (Standard)</option>
          <option value="korean">Korean (Hangul)</option>
        </select>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Unit</label>
        <select id="unitSelect" class="w-full p-2 bg-slate-900 border border-slate-800 rounded text-slate-200 focus:outline-none">
          <option value="paragraphs">Paragraphs</option>
          <option value="sentences">Sentences</option>
          <option value="words">Words</option>
        </select>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Quantity</label>
        <input type="number" id="countInput" value="3" min="1" max="50" class="w-full p-2 bg-slate-900 border border-slate-800 rounded text-slate-200 focus:outline-none" />
      </div>
      <div class="flex items-end">
        <button onclick="generateLorem()" class="w-full py-2 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-bold transition">Generate</button>
      </div>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50 text-xs">
        <span id="outputStats" class="text-slate-400">0 words</span>
        <button onclick="copyOutput()" id="copyBtn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">Copy Text</button>
      </div>
      <textarea id="outputArea" readonly class="w-full h-80 p-4 bg-transparent text-sm text-slate-200 focus:outline-none resize-y leading-relaxed font-serif"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Part of the StarSign16 Ecosystem. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">Main Hub</a></p>
  </footer>

  <script>
    const LATIN_WORDS = ["lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit", "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore", "et", "dolore", "magna", "aliqua", "enim", "ad", "minim", "veniam", "quis", "nostrud", "exercitation", "ullamco", "laboris", "nisi", "aliquip", "ex", "ea", "commodo", "consequat", "duis", "aute", "irure", "in", "reprehenderit", "voluptate", "velit", "esse", "cillum", "fugiat", "nulla", "pariatur", "excepteur", "sint", "occaecat", "cupidatat", "non", "proident", "sunt", "culpa", "qui", "officia", "deserunt", "mollit", "anim", "id", "est", "laborum"];

    const KO_WORDS = ["모든", "인간은", "태어날", "때부터", "자유로우며", "그", "존엄과", "권리에", "있어", "동등하다", "인간은", "천부적으로", "이성과", "양심을", "부여받았으며", "서로", "형제애의", "정신으로", "행동하여야", "한다", "모든", "사람은", "생명과", "신체의", "자유", "및", "안전을", "누릴", "권리를", "가진다", "어느", "누구도", "노예상태나", "예속상태에", "처하지", "아니한다", "고문이나", "잔인하고", "비인도적이거나", "굴욕적인", "대우를", "받지", "아니한다"];

    const langSelect = document.getElementById('langSelect');
    const unitSelect = document.getElementById('unitSelect');
    const countInput = document.getElementById('countInput');
    const outputArea = document.getElementById('outputArea');
    const outputStats = document.getElementById('outputStats');
    const copyBtn = document.getElementById('copyBtn');

    function getRandomSentence(wordsArr) {
      const len = Math.floor(Math.random() * 8) + 6;
      let sentence = [];
      for (let i = 0; i < len; i++) {
        sentence.push(wordsArr[Math.floor(Math.random() * wordsArr.length)]);
      }
      let res = sentence.join(' ');
      return res.charAt(0).toUpperCase() + res.slice(1) + '.';
    }

    function generateLorem() {
      const lang = langSelect.value;
      const unit = unitSelect.value;
      const count = parseInt(countInput.value) || 1;
      const pool = lang === 'latin' ? LATIN_WORDS : KO_WORDS;

      let result = [];

      if (unit === 'words') {
        for (let i = 0; i < count; i++) {
          result.push(pool[i % pool.length]);
        }
        outputArea.value = result.join(' ');
      } else if (unit === 'sentences') {
        for (let i = 0; i < count; i++) {
          result.push(getRandomSentence(pool));
        }
        outputArea.value = result.join(' ');
      } else {
        for (let i = 0; i < count; i++) {
          let para = [];
          for (let s = 0; s < 4; s++) {
            para.push(getRandomSentence(pool));
          }
          result.push(para.join(' '));
        }
        outputArea.value = result.join('\n\n');
      }

      const totalWords = outputArea.value.trim().split(/\s+/).length;
      outputStats.innerText = `${totalWords} words | ${outputArea.value.length} chars`;
    }

    function copyOutput() {
      if (!outputArea.value) return;
      navigator.clipboard.writeText(outputArea.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => copyBtn.innerText = 'Copy Text', 1500);
    }

    generateLorem();
  </script>
</body>
</html>
