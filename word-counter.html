<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word & Character Counter - StarSign16 Toolkit</title>
  <meta name="description" content="Count words, characters, bytes, and reading time in real-time. 100% client-side.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition">← StarSign16 Toolkit Hub</a>
      <div class="flex items-center gap-3">
        <a href="ko/word-counter.html" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 border border-slate-700 rounded hover:bg-slate-700 text-cyan-400">Korean</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Text & Content</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Word & Character Counter</h1>
      <p class="text-xs text-slate-400">Live text metrics, byte estimation, and reading speed calculation.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">Total Characters</span>
        <span id="charCount" class="text-3xl font-bold font-mono text-cyan-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">Chars (No Spaces)</span>
        <span id="charNoSpaceCount" class="text-3xl font-bold font-mono text-cyan-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">Words</span>
        <span id="wordCount" class="text-3xl font-bold font-mono text-indigo-400">0</span>
      </div>
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
        <span class="text-xs text-slate-500 block mb-1">Total Bytes (UTF-8)</span>
        <span id="byteCount" class="text-3xl font-bold font-mono text-indigo-400">0</span>
      </div>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-4">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50 text-xs">
        <div class="flex gap-4 text-slate-400">
          <span>Reading: <strong id="readingTime" class="text-slate-200">0s</strong></span>
          <span>Speaking: <strong id="speakingTime" class="text-slate-200">0s</strong></span>
        </div>
        <div class="flex gap-2">
          <button onclick="clearText()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition">Clear</button>
          <button onclick="copyText()" id="copyBtn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 rounded text-white font-medium transition">Copy</button>
        </div>
      </div>
      <textarea id="textInput" placeholder="Paste or start typing text here..." class="w-full h-72 p-4 bg-transparent text-sm text-slate-200 focus:outline-none resize-y leading-relaxed font-sans"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Part of the StarSign16 Ecosystem. <a href="https://starsign16.com" class="text-slate-400 hover:text-cyan-400 underline">Main Hub</a></p>
  </footer>

  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const charNoSpaceCount = document.getElementById('charNoSpaceCount');
    const wordCount = document.getElementById('wordCount');
    const byteCount = document.getElementById('byteCount');
    const readingTime = document.getElementById('readingTime');
    const speakingTime = document.getElementById('speakingTime');
    const copyBtn = document.getElementById('copyBtn');

    function updateMetrics() {
      const text = textInput.value;
      charCount.innerText = text.length.toLocaleString();
      charNoSpaceCount.innerText = text.replace(/\s/g, '').length.toLocaleString();

      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCount.innerText = words.toLocaleString();

      const bytes = new Blob([text]).size;
      byteCount.innerText = bytes.toLocaleString();

      const readMinutes = words / 200;
      const speakMinutes = words / 130;
      readingTime.innerText = readMinutes < 1 ? `${Math.ceil(readMinutes * 60)}s` : `${Math.ceil(readMinutes)}m`;
      speakingTime.innerText = speakMinutes < 1 ? `${Math.ceil(speakMinutes * 60)}s` : `${Math.ceil(speakMinutes)}m`;
    }

    function clearText() {
      textInput.value = '';
      updateMetrics();
      textInput.focus();
    }

    function copyText() {
      if (!textInput.value) return;
      navigator.clipboard.writeText(textInput.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => copyBtn.innerText = 'Copy', 1500);
    }

    textInput.addEventListener('input', updateMetrics);
  </script>
</body>
</html>
