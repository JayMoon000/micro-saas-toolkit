<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starsign16 글자수 & 단어수 측정기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8f9fa; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    h1 { font-size: 1.3rem; color: #111; font-weight: 700; }
    textarea { width: 100%; height: 280px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; line-height: 1.6; resize: vertical; outline: none; transition: border 0.2s; }
    textarea:focus { border-color: #4a90e2; }
    .btn-group { margin-top: 12px; display: flex; gap: 10px; justify-content: flex-end; }
    button { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
    .btn-clear { background: #ffe3e3; color: #e03131; }
    .btn-clear:hover { background: #ffc9c9; }
    .btn-copy { background: #e7f5ff; color: #1971c2; }
    .btn-copy:hover { background: #d0ebff; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
    .stat-card { background: #f1f3f5; padding: 15px; border-radius: 8px; text-align: center; }
    .stat-card.highlight { background: #f8f0fc; border: 1px solid #eebefa; }
    .stat-label { font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .stat-value { font-size: 1.4rem; font-weight: bold; color: #1f2937; }
    .stat-card.highlight .stat-value { color: #9c36b5; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 글자수 & 영문 단어수 측정기</h1>
  </div>
  
  <textarea id="text-input" placeholder="여기에 원문을 붙여넣으세요..."></textarea>
  
  <div class="btn-group">
    <button class="btn-clear" onclick="clearText()">🗑️ 내용 지우기</button>
    <button class="btn-copy" onclick="copyText()">📋 전체 복사</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card highlight">
      <div class="stat-label">한글 추천 (공백 제외)</div>
      <div class="stat-value" id="char-no-space">0자</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">공백 포함 글자수</div>
      <div class="stat-value" id="char-with-space">0자</div>
    </div>
    <div class="stat-card highlight">
      <div class="stat-label">영문 추천 (단어수)</div>
      <div class="stat-value" id="word-count">0 words</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">200자 원고지 분량</div>
      <div class="stat-value" id="manuscript-page">0매</div>
    </div>
  </div>
</div>

<script>
  const input = document.getElementById('text-input');
  
  input.addEventListener('input', updateStats);

  function updateStats() {
    const text = input.value;

    // 1. 공백 포함
    const withSpace = text.length;

    // 2. 공백 제외
    const noSpace = text.replace(/\s/g, '').length;

    // 3. 영문 단어수 (자동 인식)
    const trimmedText = text.trim();
    const wordCount = trimmedText ? trimmedText.split(/\s+/).length : 0;

    // 4. 원고지 매수
    const manuscript = (withSpace / 200).toFixed(1);

    document.getElementById('char-with-space').innerText = withSpace.toLocaleString() + '자';
    document.getElementById('char-no-space').innerText = noSpace.toLocaleString() + '자';
    document.getElementById('word-count').innerText = wordCount.toLocaleString() + ' words';
    document.getElementById('manuscript-page').innerText = manuscript + '매';
  }

  function clearText() {
    input.value = '';
    updateStats();
    input.focus();
  }

  function copyText() {
    if (!input.value) return;
    input.select();
    navigator.clipboard.writeText(input.value);
    alert('클립보드에 복사되었습니다.');
  }
</script>

</body>
</html>
