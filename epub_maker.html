<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1초 전자책(EPUB) 변환기 - StarSign16 Toolkit</title>
    <meta name="description" content="TXT, 마크다운 텍스트를 브라우저에서 1초 만에 표준 EPUB 전자책으로 패키징하고 다운로드합니다.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 허브로
                </a>
                <div class="w-8 h-8 bg-sky-950/80 text-sky-400 border border-sky-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">1초 전자책(EPUB) 변환기</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-sky-950/80 text-sky-400 border border-sky-800/60">
                100% 브라우저 EPUB 패키징
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Metadata Inputs -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-6 shadow-2xl space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">도서 제목</label>
                    <input type="text" id="epub-title" value="나의 첫 번째 전자책" class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 outline-none focus:border-sky-500 text-slate-200 transition">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">저자 이름</label>
                    <input type="text" id="epub-author" value="Jay" class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 outline-none focus:border-sky-500 text-slate-200 transition">
                </div>
            </div>

            <!-- Content Area -->
            <div>
                <div class="flex items-center justify-between pb-2 mb-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">본문 텍스트 (Markdown / TXT)</label>
                    <span class="text-[11px] text-slate-500">서버 전송 없이 로컬에서 생성</span>
                </div>
                <textarea id="epub-content" class="w-full h-72 p-4 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-xs text-slate-200 focus:border-sky-500 outline-none resize-none leading-relaxed transition" placeholder="전자책으로 변환할 본문 내용을 입력하세요..."></textarea>
            </div>

            <!-- Action Button -->
            <div class="pt-2 flex justify-end">
                <button onclick="generateEPUB()" class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition flex items-center space-x-2 shadow-lg shadow-sky-600/20">
                    <i class="fa-solid fa-download"></i>
                    <span>표준 EPUB 파일 즉시 다운로드</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        async function generateEPUB() {
            const title = document.getElementById('epub-title').value.trim() || '전자책';
            const author = document.getElementById('epub-author').value.trim() || '저자 미상';
            const content = document.getElementById('epub-content').value.trim() || '내용이 없습니다.';

            const zip = new JSZip();

            // 1. mimetype (압축 안 함)
            zip.file("mimetype", "application/epub+zip", { compression: "STORE" });

            // 2. META-INF/container.xml
            zip.folder("META-INF").file("container.xml", `<?xml version="1.0"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

            // 3. OEBPS 폴더 구성
            const oebps = zip.folder("OEBPS");
            
            // XHTML 본문
            const htmlContent = `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>${title}</title><style>body{font-family:sans-serif;line-height:1.6;padding:5%;}h1{color:#333;}</style></head>
<body>
  <h1>${title}</h1>
  <p><strong>저자:</strong> ${author}</p>
  <hr/>
  ${content.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('')}
</body>
</html>`;
            oebps.file("chapter1.xhtml", htmlContent);

            // OPF 파일
            oebps.file("content.opf", `<?xml version="1.0" encoding="utf-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookId" version="2.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:title>${title}</dc:title>
    <dc:creator>${author}</dc:creator>
    <dc:language>ko</dc:language>
  </metadata>
  <manifest>
    <item id="chapter1" href="chapter1.xhtml" media-type="application/xhtml+xml"/>
  </manifest>
  <spine>
    <itemref idref="chapter1"/>
  </spine>
</package>`);

            const blob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${title}.epub`;
            link.click();
        }
    </script>
</body>
</html>
