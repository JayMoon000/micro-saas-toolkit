<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노코드 플로우차트 메이커 - StarSign16 Toolkit</title>
    <meta name="description" content="텍스트 입력만으로 고화질 플로우차트와 순서도를 3초 만에 렌더링하고 이미지로 다운로드합니다.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition mr-2 text-sm font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 허브로
                </a>
                <div class="w-8 h-8 bg-indigo-950/80 text-indigo-400 border border-indigo-800/50 rounded-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-diagram-project"></i>
                </div>
                <h1 class="text-base font-bold text-slate-50">노코드 플로우차트 메이커</h1>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-950/80 text-indigo-400 border border-indigo-800/60">
                Mermaid.js 실시간 렌더링
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Template Selector Bar -->
        <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">빠른 템플릿:</span>
                <button onclick="loadTemplate('flowchart')" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-xs font-medium text-slate-200 transition">플로우차트</button>
                <button onclick="loadTemplate('mindmap')" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-xs font-medium text-slate-200 transition">마인드맵</button>
                <button onclick="loadTemplate('sequence')" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-xs font-medium text-slate-200 transition">시퀀스</button>
                <button onclick="loadTemplate('gantt')" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-xs font-medium text-slate-200 transition">일정표(간트)</button>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 font-medium">테마:</span>
                <select id="theme-select" onchange="renderDiagram()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs outline-none text-slate-200">
                    <option value="dark">다크 (Dark)</option>
                    <option value="default">기본 (Default)</option>
                    <option value="neutral">모던 그레이 (Neutral)</option>
                    <option value="forest">포레스트 (Forest)</option>
                </select>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
            <!-- Left: Text Input (5 cols) -->
            <div class="lg:col-span-5 bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">다이어그램 문법 입력</span>
                        <a href="https://mermaid.js.org/syntax/flowchart.html" target="_blank" class="text-xs text-indigo-400 hover:underline">문법 가이드 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>
                    </div>
                    <textarea id="mermaid-code" class="w-full h-[460px] p-3.5 bg-slate-900/90 border border-slate-700/70 rounded-xl font-mono text-xs text-slate-200 focus:border-indigo-500 outline-none resize-none leading-relaxed transition"></textarea>
                </div>
                <div id="error-msg" class="hidden mt-3 p-2.5 bg-rose-950/80 border border-rose-800/60 rounded-xl text-xs text-rose-300 font-mono"></div>
            </div>

            <!-- Right: Preview (7 cols) -->
            <div class="lg:col-span-7 bg-slate-800/80 rounded-2xl border border-slate-700/70 p-5 flex flex-col justify-between shadow-2xl">
                <div class="flex-1 flex flex-col">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">실시간 미리보기</span>
                        <button id="copy-svg-btn" class="px-2.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold transition flex items-center space-x-1">
                            <i class="fa-regular fa-copy"></i>
                            <span id="copy-btn-text">SVG 복사</span>
                        </button>
                    </div>
                    <div id="preview-container" class="flex-1 bg-slate-900/90 border border-slate-700/70 rounded-xl p-6 flex items-center justify-center overflow-auto min-h-[400px]">
                        <div id="mermaid-render" class="w-full flex justify-center"></div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-700/60 mt-4 flex items-center justify-between">
                    <span class="text-xs text-slate-500">우클릭으로도 이미지를 바로 복사할 수 있습니다.</span>
                    <div class="flex space-x-2">
                        <button onclick="downloadSVG()" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300 text-xs font-bold hover:bg-slate-700 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-code text-indigo-400"></i>
                            <span>SVG</span>
                        </button>
                        <button onclick="downloadPNG()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                            <i class="fa-solid fa-image"></i>
                            <span>PNG 다운로드</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const mermaidCode = document.getElementById('mermaid-code');
        const mermaidRender = document.getElementById('mermaid-render');
        const errorMsg = document.getElementById('error-msg');
        const themeSelect = document.getElementById('theme-select');
        const copySvgBtn = document.getElementById('copy-svg-btn');
        const copyBtnText = document.getElementById('copy-btn-text');

        const templates = {
            flowchart: `graph TD
    A[아이디어 발견] --> B{실현 가능성}
    B -- 높음 --> C[초경량 프로토타입 개발]
    B -- 낮음 --> D[아이디어 재정의]
    D --> A
    C --> E[3초 툴 배포]
    E --> F[사용자 피드백 & 분석]`,

            mindmap: `mindmap
  root((StarSign16))
    클라이언트 도구
      글자수 분석기
      텍스트 중복 정리
      차트 시각화기
      플로우차트
    확장 플랫폼
      서브도메인 도구
      모바일 PWA
    수익화
      클린 애드센스
      프리미엄 툴킷`,

            sequence: `sequenceDiagram
    autonumber
    actor 유저
    participant 브라우저
    participant MermaidJS
    유저->>브라우저: 텍스트 다이어그램 입력
    브라우저->>MermaidJS: 실시간 파싱 요청
    MermaidJS-->>브라우저: 고화질 SVG 렌더링
    브라우저->>유저: 0.1초 만에 화면 출력 및 이미지 다운로드`,

            gantt: `gantt
    title StarSign16 마이크로 툴킷 배포 로드맵
    dateFormat  YYYY-MM-DD
    section 핵심 유틸리티
    텍스트 및 글자수 도구       :done,    des1, 2026-08-10, 2026-08-13
    차트 및 다이어그램 도구     :done,    des2, 2026-08-14, 2026-08-16
    section 플랫폼 확장
    슬레이트 다크 테마 통합     :active,  des3, 2026-08-16, 2026-08-17
    트래픽 분석 및 SEO 적용     :         des4, after des3, 2d`
        };

        function loadTemplate(type) {
            if (templates[type]) {
                mermaidCode.value = templates[type];
                renderDiagram();
            }
        }

        let renderTimeout = null;
        mermaidCode.addEventListener('input', () => {
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(renderDiagram, 300);
        });

        async function renderDiagram() {
            const code = mermaidCode.value.trim();
            if (!code) {
                mermaidRender.innerHTML = '';
                errorMsg.classList.add('hidden');
                return;
            }

            try {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: themeSelect.value,
                    securityLevel: 'loose'
                });

                const id = 'mermaid-svg-' + Date.now();
                const { svg } = await mermaid.render(id, code);
                mermaidRender.innerHTML = svg;
                errorMsg.classList.add('hidden');
            } catch (err) {
                errorMsg.innerText = '문법 오류: ' + (err.message || '다이어그램 코드를 확인하세요.');
                errorMsg.classList.remove('hidden');
            }
        }

        copySvgBtn.addEventListener('click', async () => {
            const svgEl = mermaidRender.querySelector('svg');
            if (!svgEl) return;
            await navigator.clipboard.writeText(svgEl.outerHTML);
            copyBtnText.innerText = '복사 완료!';
            setTimeout(() => { copyBtnText.innerText = 'SVG 복사'; }, 1500);
        });

        function downloadSVG() {
            const svgEl = mermaidRender.querySelector('svg');
            if (!svgEl) return;
            const blob = new Blob([svgEl.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diagram_${Date.now()}.svg`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const svgEl = mermaidRender.querySelector('svg');
            if (!svgEl) return;

            const svgData = new XMLSerializer().serializeToString(svgEl);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const URLObj = window.URL || window.webkitURL || window;
            const blobURL = URLObj.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = 2;
                const bbox = svgEl.getBoundingClientRect();
                canvas.width = (bbox.width || 800) * scale;
                canvas.height = (bbox.height || 600) * scale;

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = themeSelect.value === 'dark' ? '#0f172a' : '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scale, scale);
                ctx.drawImage(image, 0, 0);

                const pngURL = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngURL;
                a.download = `diagram_${Date.now()}.png`;
                a.click();
                URLObj.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }

        loadTemplate('flowchart');
    </script>
</body>
</html>
